name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remediate:
    name: Apply import concurrency remediation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply and push remediation
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/api/src/repositories/imports.ts")
          text = path.read_text()
          old = '''export async function approveImportSuggestionForContext(
            context: TenantContext,
            importBatchId: EntityId,
            suggestionId: EntityId,
          ): Promise<ImportReviewDecisionResult> {
            const outcome = await withSharedTransaction(async (executeQuery) => {
              const pendingCandidates = await ensureCurrentDeterministicCandidates(
                context,
                importBatchId,
                suggestionId,
                executeQuery,
              );
              if (pendingCandidates.length > 0) {
                return { blockedCandidates: pendingCandidates.map((candidate) => candidate.detail) } as const;
              }
              return approveImportSuggestionInTransaction(context, importBatchId, suggestionId, executeQuery);
            });

            if ("blockedCandidates" in outcome) {
              throw new ImportReviewError(
                "IMPORT_REVIEW_CANDIDATE_PENDING",
                "Resolva as possíveis duplicidades ou conciliações antes de confirmar esta linha.",
                409,
                { candidates: outcome.blockedCandidates },
              );
            }
            return outcome;
          }'''
          new = '''export async function approveImportSuggestionForContext(
            context: TenantContext,
            importBatchId: EntityId,
            suggestionId: EntityId,
          ): Promise<ImportReviewDecisionResult> {
            const outcome = await withSharedTransaction(async (executeQuery) => {
              await requireMutableBatch(context, importBatchId, executeQuery);
              const suggestion = await requireImportSuggestion(
                context,
                importBatchId,
                suggestionId,
                executeQuery,
                false,
              );

              if (suggestion.status === "pending_review") {
                const payload = requireExtractionPayload(suggestion);
                if (payload.kind === "transfer") {
                  const existingCandidates = await executeQuery<{ id: string }>(
                    `select "id" from "AiSuggestion"
                     where "organizationId" = $1 and "financialProfileId" = $2
                       and "sourceSuggestionId" = $3 and "payloadFingerprint" = $4
                       and "kind" in ('DEDUPLICATION', 'RECONCILIATION')
                       and "status" = 'PENDING_REVIEW'
                     limit 1`,
                    [
                      context.organizationId,
                      context.financialProfileId,
                      suggestion.id,
                      buildImportPayloadFingerprint(payload),
                    ],
                  );

                  if (existingCandidates.length === 0) {
                    return approveImportSuggestionInTransaction(
                      context,
                      importBatchId,
                      suggestionId,
                      executeQuery,
                    );
                  }
                }
              }

              const pendingCandidates = await ensureCurrentDeterministicCandidates(
                context,
                importBatchId,
                suggestionId,
                executeQuery,
              );
              if (pendingCandidates.length > 0) {
                return { blockedCandidates: pendingCandidates.map((candidate) => candidate.detail) } as const;
              }
              return approveImportSuggestionInTransaction(
                context,
                importBatchId,
                suggestionId,
                executeQuery,
              );
            });

            if ("blockedCandidates" in outcome) {
              throw new ImportReviewError(
                "IMPORT_REVIEW_CANDIDATE_PENDING",
                "Resolva as possíveis duplicidades ou conciliações antes de confirmar esta linha.",
                409,
                { candidates: outcome.blockedCandidates },
              );
            }
            return outcome;
          }'''
          if old not in text:
            raise SystemExit("approval function anchor not found")
          path.write_text(text.replace(old, new, 1))
          PY
          npx prettier apps/api/src/repositories/imports.ts --write
          git fetch origin main:refs/remotes/origin/main
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "solverfin-ci-remediation"
          git config user.email "solverfin-ci-remediation@users.noreply.github.com"
          git add .github/workflows/ci.yml apps/api/src/repositories/imports.ts
          git commit -m "fix(import): preserve concurrent transfer convergence"
          git push origin HEAD:"$HEAD_BRANCH"
