name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate monorepo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://solverfin:solverfin_dev_password@localhost:5432/solverfin?schema=public

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: solverfin
          POSTGRES_USER: solverfin
          POSTGRES_PASSWORD: solverfin_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solverfin -d solverfin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Format issue 539 browser scenario
        run: npx prettier --write scripts/statement-visual/issue-539-installment-grouping-guard.mjs

      - name: Upload formatted issue 539 browser scenario
        uses: actions/upload-artifact@v4
        with:
          name: issue-539-browser-formatted
          path: scripts/statement-visual/issue-539-installment-grouping-guard.mjs
          if-no-files-found: error
          retention-days: 1

      - name: Stop after formatter artifact
        run: exit 1

  integration-api-postgres:
    name: Integration API + PostgreSQL
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo skipped during temporary formatter run
