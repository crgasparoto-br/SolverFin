name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate monorepo
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://solverfin:solverfin_dev_password@localhost:5432/solverfin?schema=public

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: solverfin
          POSTGRES_USER: solverfin
          POSTGRES_PASSWORD: solverfin_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solverfin -d solverfin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Align focus assertion with the opened trigger and restore workflow
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'scripts/statement-visual/accounts-cards-interface.mjs';
          const source = fs.readFileSync(file, 'utf8');
          const before = `  const closed = await evaluate(
    cdp,
    \`(() => {
      const panel = document.querySelector('[data-tab-panel="\${expectedTab}"]:not([hidden])');
      const trigger = panel?.querySelector('.item-actions .action-menu-trigger');
      return {
        expanded: trigger?.getAttribute('aria-expanded') || '',
        focusRestored: document.activeElement === trigger,
      };
    })()\`,
  );`;
          const after = `  const closed = await evaluate(
    cdp,
    \`(() => {
      const panel = document.querySelector('[data-tab-panel="\${expectedTab}"]:not([hidden])');
      const activeElement = document.activeElement;
      const trigger = Array.from(panel?.querySelectorAll('.item-actions .action-menu-trigger') || []).find(
        (candidate) => candidate.getAttribute('aria-label') === \${JSON.stringify(opened.triggerLabel)},
      );
      return {
        expanded: trigger?.getAttribute('aria-expanded') || '',
        focusRestored:
          activeElement?.matches?.('.action-menu-trigger') === true &&
          activeElement.getAttribute('aria-label') === \${JSON.stringify(opened.triggerLabel)},
        activeTag: activeElement?.tagName || '',
        activeClass: activeElement?.className || '',
        activeLabel: activeElement?.getAttribute?.('aria-label') || '',
        triggerConnected: Boolean(trigger?.isConnected),
      };
    })()\`,
  );`;
          if (!source.includes(before)) throw new Error('focus assertion block not found');
          fs.writeFileSync(file, source.replace(before, after));
          NODE
          npx prettier scripts/statement-visual/accounts-cards-interface.mjs --write
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml scripts/statement-visual/accounts-cards-interface.mjs
          if ! git diff --cached --quiet; then
            git commit -m "test: validar foco pelo acionador realmente aberto"
            git push origin HEAD:"${HEAD_BRANCH}"
          fi

      - name: Check environment example
        run: npm run env:check

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Check demo seed script
        run: npm run db:seed:check

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply migrations
        run: npm run db:deploy

      - name: Seed demo data
        run: npm run db:seed

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  integration-api-postgres:
    name: Integration API + PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://solverfin:solverfin_ci_password@localhost:5432/solverfin_ci?schema=public

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: solverfin_ci
          POSTGRES_USER: solverfin
          POSTGRES_PASSWORD: solverfin_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solverfin -d solverfin_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Build packages
        run: npm run build:packages

      - name: Apply migrations
        run: npm run db:deploy

      - name: Seed demo data
        run: npm run db:seed

      - name: Run API integration tests
        run: npm run test:integration --workspace @solverfin/api

      - name: Verify import statement consistency
        run: npm run diagnose:import-statement-consistency -- --expect-zero
