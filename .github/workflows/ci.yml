name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate monorepo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Capture lint output
        run: |
          set +e
          npm run lint > issue-539-lint-output.txt 2>&1
          status=$?
          cat issue-539-lint-output.txt
          echo "$status" > issue-539-lint-status.txt
          exit 0

      - name: Upload lint diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: issue-539-lint-diagnostic
          path: |
            issue-539-lint-output.txt
            issue-539-lint-status.txt
          if-no-files-found: error
          retention-days: 1

      - name: Stop after lint diagnostic
        run: exit 1

  integration-api-postgres:
    name: Integration API + PostgreSQL
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo skipped during temporary lint diagnostic
