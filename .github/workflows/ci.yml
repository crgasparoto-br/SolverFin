name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-issue-546-format:
    name: Export issue 546 formatted files
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Format issue files
        run: |
          npx prettier --write \
            apps/api/src/category-evolution-account-filter.integration.test.ts \
            apps/api/src/category-evolution-account-filter.test.ts \
            apps/api/src/category-evolution-account-filter.ts \
            apps/api/src/category-evolution-account-router.integration.test.ts \
            apps/api/src/reports-router.ts \
            apps/web/src/dev-server.ts \
            apps/web/src/dev-server/reports-canonical-location.test.ts \
            apps/web/src/dev-server/reports-canonical-location.ts \
            apps/web/src/dev-server/reports-category-evolution-issue-546.test.ts \
            apps/web/src/dev-server/reports-category-evolution-runtime.ts \
            apps/web/src/dev-server/reports-route-page-styles.ts \
            apps/web/src/dev-server/reports-route-page.test.ts \
            apps/web/src/dev-server/reports-route-page.ts \
            docs/API_REPORTS.md \
            docs/REPORTS.md \
            scripts/run-statement-visual-validation.mjs \
            scripts/statement-visual/issue-546-reports-category-controls.mjs
          mkdir -p artifacts/issue-546-formatted
          cp --parents \
            apps/api/src/category-evolution-account-filter.integration.test.ts \
            apps/api/src/category-evolution-account-filter.test.ts \
            apps/api/src/category-evolution-account-filter.ts \
            apps/api/src/category-evolution-account-router.integration.test.ts \
            apps/api/src/reports-router.ts \
            apps/web/src/dev-server.ts \
            apps/web/src/dev-server/reports-canonical-location.test.ts \
            apps/web/src/dev-server/reports-canonical-location.ts \
            apps/web/src/dev-server/reports-category-evolution-issue-546.test.ts \
            apps/web/src/dev-server/reports-category-evolution-runtime.ts \
            apps/web/src/dev-server/reports-route-page-styles.ts \
            apps/web/src/dev-server/reports-route-page.test.ts \
            apps/web/src/dev-server/reports-route-page.ts \
            docs/API_REPORTS.md \
            docs/REPORTS.md \
            scripts/run-statement-visual-validation.mjs \
            scripts/statement-visual/issue-546-reports-category-controls.mjs \
            artifacts/issue-546-formatted

      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: issue-546-formatted-${{ github.sha }}
          path: artifacts/issue-546-formatted
          if-no-files-found: error

  validate:
    name: Validate monorepo
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://solverfin:solverfin_dev_password@localhost:5432/solverfin?schema=public

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: solverfin
          POSTGRES_USER: solverfin
          POSTGRES_PASSWORD: solverfin_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solverfin -d solverfin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check environment example
        run: npm run env:check

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Check demo seed script
        run: npm run db:seed:check

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply migrations
        run: npm run db:deploy

      - name: Seed demo data
        run: npm run db:seed

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  integration-api-postgres:
    name: Integration API + PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://solverfin:solverfin_ci_password@localhost:5432/solverfin_ci?schema=public

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: solverfin_ci
          POSTGRES_USER: solverfin
          POSTGRES_PASSWORD: solverfin_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solverfin -d solverfin_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Build packages
        run: npm run build:packages

      - name: Apply migrations
        run: npm run db:deploy

      - name: Seed demo data
        run: npm run db:seed

      - name: Run API integration tests
        run: npm run test:integration --workspace @solverfin/api

      - name: Verify import statement consistency
        run: npm run diagnose:import-statement-consistency -- --expect-zero
