name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate monorepo
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://solverfin:solverfin_dev_password@localhost:5432/solverfin?schema=public

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: solverfin
          POSTGRES_USER: solverfin
          POSTGRES_PASSWORD: solverfin_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solverfin -d solverfin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply controlled issue 546 formatting
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/546-category-evolution-controls-account-filter'
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          git fetch origin "$TARGET_BRANCH:$TARGET_BRANCH"
          git checkout "$TARGET_BRANCH"
          python - <<'PY'
          from pathlib import Path

          page = Path("apps/web/src/dev-server/reports-route-page.ts")
          content = page.read_text()
          old = "const sourceError = !accountsResult.ok ? accountsResult.error : cardsResult.error;"
          new = '''const sourceError = !accountsResult.ok
                ? accountsResult.error
                : !cardsResult.ok
                  ? cardsResult.error
                  : "Não foi possível carregar as origens financeiras.";'''
          if old not in content and "Não foi possível carregar as origens financeiras." not in content:
              raise SystemExit("Expected reports source error assignment was not found")
          page.write_text(content.replace(old, new))

          source = Path("apps/api/src/category-evolution-account-filter.ts")
          source_content = source.read_text()
          source_content = source_content.replace(
              '`${label} inválido. Informe um identificador válido.`',
              '`${label === "Conta" ? "Conta inválida" : "Cartão inválido"}. Informe um identificador válido.`',
          )
          source.write_text(source_content)

          test = Path("apps/api/src/category-evolution-account-filter.test.ts")
          test_content = test.read_text().replace(
              'error.message.includes(`${label} inválido`)',
              'error.message.includes(label === "Conta" ? "Conta inválida" : "Cartão inválido")',
          )
          test.write_text(test_content)

          router_test = Path("apps/api/src/category-evolution-account-router.integration.test.ts")
          router_test.write_text(router_test.read_text().replace('/Conta inválido/', '/Conta inválida/'))
          PY
          npx prettier --write \
            apps/api/src/category-evolution-account-filter.integration.test.ts \
            apps/api/src/category-evolution-account-filter.ts \
            apps/api/src/category-evolution-account-filter.test.ts \
            apps/api/src/category-evolution-account-router.integration.test.ts \
            apps/web/src/dev-server/reports-canonical-location.test.ts \
            apps/web/src/dev-server/reports-canonical-location.ts \
            apps/web/src/dev-server/reports-category-evolution-issue-546.test.ts \
            apps/web/src/dev-server/reports-route-page.test.ts \
            apps/web/src/dev-server/reports-route-page.ts \
            scripts/statement-visual/issue-546-reports-category-controls.mjs
          if git diff --quiet; then
            echo "Issue 546 files already formatted."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              apps/api/src/category-evolution-account-filter.integration.test.ts \
              apps/api/src/category-evolution-account-filter.ts \
              apps/api/src/category-evolution-account-filter.test.ts \
              apps/api/src/category-evolution-account-router.integration.test.ts \
              apps/web/src/dev-server/reports-canonical-location.test.ts \
              apps/web/src/dev-server/reports-canonical-location.ts \
              apps/web/src/dev-server/reports-category-evolution-issue-546.test.ts \
              apps/web/src/dev-server/reports-route-page.test.ts \
              apps/web/src/dev-server/reports-route-page.ts \
              scripts/statement-visual/issue-546-reports-category-controls.mjs
            git commit -m "style(reports): format issue 546 remediation"
            git push origin "HEAD:$TARGET_BRANCH"
          fi

      - name: Check environment example
        run: npm run env:check

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Check demo seed script
        run: npm run db:seed:check

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply migrations
        run: npm run db:deploy

      - name: Seed demo data
        run: npm run db:seed

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  integration-api-postgres:
    name: Integration API + PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://solverfin:solverfin_ci_password@localhost:5432/solverfin_ci?schema=public

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: solverfin_ci
          POSTGRES_USER: solverfin
          POSTGRES_PASSWORD: solverfin_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solverfin -d solverfin_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Build packages
        run: npm run build:packages

      - name: Apply migrations
        run: npm run db:deploy

      - name: Seed demo data
        run: npm run db:seed

      - name: Run API integration tests
        run: npm run test:integration --workspace @solverfin/api

      - name: Verify import statement consistency
        run: npm run diagnose:import-statement-consistency -- --expect-zero
