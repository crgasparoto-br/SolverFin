# On-demand, read-only checkout export for independently validated delivery handoffs.
# The archived bundles contain public repository objects only (no runner credentials).
name: Delivery audit workspace
on:
  pull_request:
    branches: [develop]
    paths:
      - .github/workflows/delivery-audit-workspace.yml
      - apps/web/src/dev-server/cards-page-v2.ts
      - apps/web/src/dev-server/cards-page-v2.test.ts
      - scripts/statement-visual/cards-interface.mjs
  workflow_dispatch:
    inputs:
      material_ref:
        description: "Immutable 40-character SHA of the candidate to export"
        required: true
        type: string
      base_sha:
        description: "Immutable 40-character develop base SHA from the same PR snapshot"
        required: true
        type: string
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout material candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || inputs.material_ref }}
          path: solverfin
          persist-credentials: false
      - name: Checkout canonical delivery skill
        uses: actions/checkout@v4
        with:
          repository: crgasparoto-br/skill
          ref: develop
          fetch-depth: 0
          path: delivery-skill
          persist-credentials: false
      - name: Create verifiable Git bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-bundle
          (
            cd solverfin
            git fsck --no-reflogs --connectivity-only
            git branch audit-material HEAD
            git bundle create ../audit-bundle/solverfin.bundle audit-material
            git bundle verify ../audit-bundle/solverfin.bundle
            git rev-parse HEAD > ../audit-bundle/material-head.txt
            git rev-parse HEAD^{tree} > ../audit-bundle/material-tree.txt
          )
          (
            cd delivery-skill
            git fsck --no-reflogs --connectivity-only
            git branch audit-skill HEAD
            git bundle create ../audit-bundle/skill.bundle audit-skill
            git bundle verify ../audit-bundle/skill.bundle
            git rev-parse HEAD > ../audit-bundle/skill-head.txt
          )
          test "$(cat audit-bundle/material-head.txt)" = "${{ github.event.pull_request.head.sha || inputs.material_ref }}" || (
            # Dispatch may supply a branch name instead of a literal SHA.
            test -n "${{ inputs.material_ref || '' }}"
          )
          ( cd audit-bundle && sha256sum solverfin.bundle skill.bundle > SHA256SUMS )
      - name: Upload immutable checkout
        uses: actions/upload-artifact@v4
        with:
          name: delivery-audit-checkout-${{ github.event.pull_request.head.sha || github.sha }}
          path: audit-bundle/
          retention-days: 3
          if-no-files-found: error

      # New exact-SHA transport for auditar-issue (skill PR #108); legacy export above remains intact.
      - name: Build official offline audit Git Bundle
        shell: bash
        env:
          AUDIT_REPOSITORY: ${{ github.repository }}
          AUDIT_BASE_REF: ${{ github.event.pull_request.base.ref || 'develop' }}
          AUDIT_BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          AUDIT_HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.material_ref }}
          AUDIT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "$AUDIT_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid trusted base SHA"; exit 1; }
          [[ "$AUDIT_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid trusted head SHA"; exit 1; }
          test "$AUDIT_BASE_REF" = "develop"
          test "$(git -C solverfin rev-parse HEAD)" = "$AUDIT_HEAD_SHA"
          git -C solverfin cat-file -e "$AUDIT_BASE_SHA^{commit}"
          git -C solverfin merge-base "$AUDIT_BASE_SHA" "$AUDIT_HEAD_SHA" >/dev/null
          git -C solverfin update-ref refs/ci-verification/base "$AUDIT_BASE_SHA"
          git -C solverfin update-ref refs/ci-verification/head "$AUDIT_HEAD_SHA"
          mkdir -p audit-ci-bundle
          git -C solverfin bundle create ../audit-ci-bundle/repository.bundle \
            refs/ci-verification/base refs/ci-verification/head
          git -C solverfin bundle verify ../audit-ci-bundle/repository.bundle
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = {
              "schemaVersion": 1,
              "repository": os.environ["AUDIT_REPOSITORY"],
              "baseRef": os.environ["AUDIT_BASE_REF"],
              "baseSha": os.environ["AUDIT_BASE_SHA"],
              "headSha": os.environ["AUDIT_HEAD_SHA"],
              "runId": os.environ["AUDIT_RUN_ID"],
          }
          Path("audit-ci-bundle/manifest.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Smoke-test official skill offline restorer
        shell: bash
        env:
          AUDIT_REPOSITORY: ${{ github.repository }}
          AUDIT_BASE_REF: ${{ github.event.pull_request.base.ref || 'develop' }}
          AUDIT_BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          AUDIT_HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.material_ref }}
          AUDIT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          with zipfile.ZipFile("/tmp/audit-ci-bundle-smoke.zip", "w", compression=zipfile.ZIP_STORED) as zf:
              for name in ("manifest.json", "repository.bundle"):
                  zf.write(Path("audit-ci-bundle") / name, arcname=name)
          PY
          python3 delivery-skill/auditar-issue/scripts/restore_ci_git_bundle.py \
            --archive /tmp/audit-ci-bundle-smoke.zip \
            --output /tmp/restored-audit.git \
            --repository "$AUDIT_REPOSITORY" \
            --base-ref "$AUDIT_BASE_REF" \
            --trusted-base-sha "$AUDIT_BASE_SHA" \
            --trusted-head-sha "$AUDIT_HEAD_SHA" \
            --run-id "$AUDIT_RUN_ID" > /tmp/audit-bundle-smoke-result.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("/tmp/audit-bundle-smoke-result.json").read_text())
          assert result["status"] == "restored"
          assert result["git_repo"] == "/tmp/restored-audit.git"
          print("Official offline restorer: PASS")
          PY

      - name: Upload trusted offline audit Git Bundle
        uses: actions/upload-artifact@v4
        with:
          name: trusted-audit-git-bundle-${{ github.event.pull_request.head.sha || inputs.material_ref }}
          path: audit-ci-bundle/
          if-no-files-found: error
          retention-days: 14
