name: Delivery V2 Format Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prettier-diff:
    name: Prettier canonical diff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Print canonical Prettier diff
        shell: bash
        run: |
          set -euo pipefail
          npx prettier scripts/delivery-v2-ci-classifier.mjs --write
          git --no-pager diff -- scripts/delivery-v2-ci-classifier.mjs
          test -z "$(git status --porcelain -- scripts/delivery-v2-ci-classifier.mjs)"
