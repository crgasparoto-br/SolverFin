name: Diagnose issue 541 root tests

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: diagnose-issue-541-root-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: solverfin
          POSTGRES_USER: solverfin
          POSTGRES_PASSWORD: solverfin_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solverfin -d solverfin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://solverfin:solverfin_dev_password@localhost:5432/solverfin?schema=public
      DIRECT_URL: postgresql://solverfin:solverfin_dev_password@localhost:5432/solverfin?schema=public
      SESSION_SECRET: ci_session_secret_with_at_least_32_chars
      API_BASE_URL: http://localhost:4000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply migrations
        run: npm run db:deploy

      - name: Seed demo data
        run: npm run db:seed

      - name: Run root tests and preserve output
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test 2>&1 | tee issue-541-root-test-output.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload root test output
        uses: actions/upload-artifact@v4
        with:
          name: issue-541-root-test-output
          path: issue-541-root-test-output.log
          if-no-files-found: error

      - name: Propagate root test result
        if: steps.tests.outputs.exit_code != '0'
        run: exit 1
