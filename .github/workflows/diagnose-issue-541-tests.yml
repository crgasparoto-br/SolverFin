name: Diagnose issue 541 web tests

on:
  push:
    branches:
      - feat/541-ssr-style-contract

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: feat/541-ssr-style-contract

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run web tests and capture output
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test --workspace @solverfin/web 2>&1 | tee issue-541-test-diagnostic.log

      - name: Commit diagnostic output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add issue-541-test-diagnostic.log
          git commit -m "chore: capture issue 541 web test diagnostic"
          git push origin HEAD:feat/541-ssr-style-contract

      - name: Fail when tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
