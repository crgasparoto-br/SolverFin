name: Diagnose issue 541 web tests

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: diagnose-issue-541-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build packages
        run: npm run build:packages

      - name: Run web tests and preserve output
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test --workspace @solverfin/web 2>&1 | tee issue-541-web-test-output.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload web test output
        uses: actions/upload-artifact@v4
        with:
          name: issue-541-web-test-output
          path: issue-541-web-test-output.log
          if-no-files-found: error

      - name: Propagate web test result
        if: steps.tests.outputs.exit_code != '0'
        run: exit 1
