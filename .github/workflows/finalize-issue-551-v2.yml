name: Finalize issue 551 v2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://solverfin:solverfin_dev_password@localhost:5432/solverfin?schema=public
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: solverfin
          POSTGRES_USER: solverfin
          POSTGRES_PASSWORD: solverfin_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solverfin -d solverfin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: feat/551-oidc-cookie-sessions
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Reconstruct verified source overlay
        run: |
          cat .github/source-payload/part-* > /tmp/solverfin-overlay.tar.gz.b64
          echo "8d415f561242b950e64b107be972b4755465534a92901cdca5247028c133ee4e  /tmp/solverfin-overlay.tar.gz.b64" | sha256sum --check
          base64 --decode /tmp/solverfin-overlay.tar.gz.b64 > /tmp/solverfin-overlay.tar.gz
          echo "993195865e507c59dbc8e72947efc8c0173e4326279c68fb179d01cd2f2bf535  /tmp/solverfin-overlay.tar.gz" | sha256sum --check
          tar -xzf /tmp/solverfin-overlay.tar.gz

      - name: Apply exact final remediations
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              target.write_text(text.replace(old, new, 1))

          replace_once(
              "apps/api/src/auth-cookie-session.integration.test.ts",
              '''  const jwk = publicKey.export({ format: "jwk" }) as JsonWebKey & { kid: string; alg: string };
          jwk.kid = "issue-551-key";
          jwk.alg = "RS256";''',
              '''  const jwk = {
            ...(publicKey.export({ format: "jwk" }) as unknown as Record<string, unknown>),
            kid: "issue-551-key",
            alg: "RS256",
          };''',
          )
          replace_once(
              "apps/api/src/auth-cookie.test.ts",
              "        captured.params = params;",
              "        if (params !== undefined) captured.params = params;",
          )
          replace_once(
              "apps/api/src/auth-service.ts",
              "  if (!process.env.DATABASE_URL) {",
              "  if (!env.DATABASE_URL) {",
          )
          replace_once(
              "apps/api/src/mvp.ts",
              'import { completeOidcCallback, startOidcLogin } from "./oidc-flow.js";',
              '''import {
            completeOidcCallback,
            startOidcLogin,
            type OidcCallbackInput,
          } from "./oidc-flow.js";''',
          )
          replace_once(
              "apps/api/src/mvp.ts",
              '''      const result = await completeOidcCallback({
                state: request.query?.get("state") ?? undefined,
                code: request.query?.get("code") ?? undefined,
                error: request.query?.get("error") ?? undefined,
              });''',
              '''      const callbackInput: OidcCallbackInput = {};
              const state = request.query?.get("state");
              const code = request.query?.get("code");
              const error = request.query?.get("error");

              if (state !== null && state !== undefined) callbackInput.state = state;
              if (code !== null && code !== undefined) callbackInput.code = code;
              if (error !== null && error !== undefined) callbackInput.error = error;

              const result = await completeOidcCallback(callbackInput);''',
          )
          replace_once(
              "apps/api/src/oidc-flow.ts",
              "      fetchJwks: options.fetchJwks,",
              "      ...(options.fetchJwks ? { fetchJwks: options.fetchJwks } : {}),",
          )
          replace_once(
              "apps/api/src/server.ts",
              "    headers[name] = Array.isArray(value) ? [...value] : value;",
              '    headers[name] = typeof value === "string" ? value : [...value];',
          )
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply migrations
        run: npm run db:deploy

      - name: Seed demo data
        run: npm run db:seed

      - name: Format source
        run: npx prettier --write .

      - name: Validate implementation
        run: npm run validate

      - name: Remove temporary transport
        run: |
          rm -rf .github/source-payload
          rm -rf .github/final-fixes
          rm -f .github/workflows/source-export.yml
          rm -f .github/workflows/finalize-issue-551.yml
          rm -f .github/workflows/finalize-issue-551-v2.yml
          rm -f .github/workflows/finalize-issue-551-v3.yml

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(auth): add productive OIDC cookie sessions"
          git push origin HEAD:feat/551-oidc-cookie-sessions
