name: Fix issue 535 confirmation scenario

on:
  push:
    branches:
      - feat/535-padronizar-contas-cartoes

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/535-padronizar-contas-cartoes
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Exercise a visible destructive action
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('scripts/statement-visual/accounts-cards-interface.mjs')
          content = path.read_text()
          before = (
              "      const form = document.querySelector('[data-tab-panel=\"cards\"]:not([hidden]) form[data-confirm]');\n"
              "      const trigger = form?.querySelector('button[type=\"submit\"]:not([disabled])');\n"
              "      if (!form || !trigger) return false;\n"
          )
          after = (
              "      const instrumentsTrigger = document.querySelector('[data-tab-panel=\"cards\"]:not([hidden]) [data-view-instruments]');\n"
              "      if (!instrumentsTrigger) return false;\n"
              "      instrumentsTrigger.click();\n"
              "      const instrumentsDialog = document.querySelector('dialog[data-card-instruments-dedicated-dialog][open]');\n"
              "      const forms = instrumentsDialog ? Array.from(instrumentsDialog.querySelectorAll('form[data-confirm]')) : [];\n"
              "      const form = forms.find((candidate) => {\n"
              "        const candidateTrigger = candidate.querySelector('button[type=\"submit\"]:not([disabled])');\n"
              "        const rect = candidateTrigger?.getBoundingClientRect();\n"
              "        return Boolean(rect && rect.width > 0 && rect.height > 0);\n"
              "      });\n"
              "      const trigger = form?.querySelector('button[type=\"submit\"]:not([disabled])');\n"
              "      if (!form || !trigger) return false;\n"
          )
          if before not in content:
              raise SystemExit('expected confirmation scenario was not found')
          path.write_text(content.replace(before, after, 1))
          PY
          npx prettier --write scripts/statement-visual/accounts-cards-interface.mjs
          rm .github/workflows/fix-issue-535-confirmation-scenario.yml

      - name: Commit fix and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/statement-visual/accounts-cards-interface.mjs
          git add .github/workflows/fix-issue-535-confirmation-scenario.yml
          git commit -m "test: validar confirmacao por acao visivel da issue 535"
          git push
