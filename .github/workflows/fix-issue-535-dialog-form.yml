name: Fix issue 535 dialog form selector

on:
  push:
    branches:
      - feat/535-padronizar-contas-cartoes

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/535-padronizar-contas-cartoes
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Restrict dialog form standardization
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/web/src/dev-server/accounts-cards-standardization.ts';
          const before = fs.readFileSync(path, 'utf8');
          const from = "const form = dialog.querySelector('form[data-api-form]');";
          const to = "const form = dialog.querySelector('form[data-api-form].edit-grid');";
          if (!before.includes(from)) throw new Error('Expected selector was not found');
          fs.writeFileSync(path, before.replace(from, to));
          NODE
          npx prettier --write apps/web/src/dev-server/accounts-cards-standardization.ts
          rm .github/workflows/fix-issue-535-dialog-form.yml

      - name: Commit fix and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/dev-server/accounts-cards-standardization.ts
          git add .github/workflows/fix-issue-535-dialog-form.yml
          git commit -m "fix: preservar acoes inline no modal de instrumentos"
          git push
