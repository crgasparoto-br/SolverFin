name: Fix issue 535 visual regex

on:
  push:
    branches:
      - feat/535-padronizar-contas-cartoes

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/535-padronizar-contas-cartoes
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fix generated runtime regex
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('scripts/statement-visual/accounts-cards-interface.mjs')
          content = path.read_text()
          before = "hasUnmaskedLongNumber: /(?:\\d[ -]?){12,19}/.test(text.replace(/\\*+/g, ''))," 
          after = "hasUnmaskedLongNumber: /(?:\\\\d[ -]?){12,19}/.test(text.replace(/\\\\*+/g, ''))," 
          if before not in content:
              raise SystemExit('expected runtime regex was not found')
          path.write_text(content.replace(before, after))
          PY
          rm .github/workflows/fix-issue-535-visual-regex.yml

      - name: Commit fix and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/statement-visual/accounts-cards-interface.mjs
          git add .github/workflows/fix-issue-535-visual-regex.yml
          git commit -m "fix: escapar regex do gate visual da issue 535"
          git push
