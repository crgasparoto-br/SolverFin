name: Format diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: format-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-diagnostic:
    name: Generate Prettier patch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Format working tree
        run: npm run format

      - name: Save formatted patch
        run: git diff --binary > prettier.patch

      - name: Upload formatted patch
        uses: actions/upload-artifact@v4
        with:
          name: prettier-patch-${{ github.sha }}
          path: prettier.patch
          if-no-files-found: error
