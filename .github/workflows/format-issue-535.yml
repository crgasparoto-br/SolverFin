name: Format issue 535

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feat/535-padronizar-contas-cartoes'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format changed files
        run: |
          npx prettier --write \
            apps/web/src/dev-server.ts \
            apps/web/src/dev-server/accounts-cards-standardization.ts \
            apps/web/src/dev-server/accounts-cards-standardization.test.ts

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/dev-server.ts
          git add apps/web/src/dev-server/accounts-cards-standardization.ts
          git add apps/web/src/dev-server/accounts-cards-standardization.test.ts
          git commit -m "style: apply repository formatter"
          git push
