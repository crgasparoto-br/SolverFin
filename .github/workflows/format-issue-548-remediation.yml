name: Finalize issue 548 remediation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/548-ofx-inbox-import

permissions:
  contents: write

concurrency:
  group: issue-548-remediation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event_name == 'pull_request' || github.ref_name == 'feat/548-ofx-inbox-import'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/548-ofx-inbox-import
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Reconstruct verified remediation package
        run: |
          cat .audit/parts/part-* > /tmp/issue-548-remediation.b64
          echo "7064ffe964dc3b2725e724c0809db1ba97d42021d02c4d4daba450f0682d75ba  /tmp/issue-548-remediation.b64" | sha256sum -c -
          base64 -d /tmp/issue-548-remediation.b64 > /tmp/issue-548-remediation.tar.gz
          tar -tzf /tmp/issue-548-remediation.tar.gz > /tmp/issue-548-remediation-files.txt
          tar -xzf /tmp/issue-548-remediation.tar.gz

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Format and validate
        run: |
          npm run format
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test
          npm run build

      - name: Remove temporary remediation material
        run: |
          rm -rf .audit
          rm -f .github/workflows/format-issue-548-remediation.yml

      - name: Commit final remediation
        env:
          BRANCH_NAME: feat/548-ofx-inbox-import
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .github/workflows/ci.yml \
            apps/api/src/import-batches-router.ts \
            apps/api/src/ofx-import-review.integration.test.ts \
            apps/api/src/ofx-imports.test.ts \
            apps/api/src/repositories/ofx-import-parser.ts \
            apps/api/src/repositories/ofx-import-store.ts \
            apps/api/src/repositories/ofx-imports.ts \
            apps/web/src/dev-server/inbox-category-hierarchy-enhancement.ts \
            apps/web/src/dev-server/inbox-category-hierarchy-first-render.test.ts \
            apps/web/src/dev-server/inbox-list-layout-enhancement.ts \
            apps/web/src/dev-server/inbox-ofx-import-enhancement.test.ts \
            apps/web/src/dev-server/inbox-ofx-import-enhancement.ts \
            docs/IMPORTS.md \
            docs/STATUS_MATRIX.md \
            scripts/run-statement-visual-validation.mjs \
            scripts/statement-visual/issue-548-inbox-ofx-review.mjs
          git add -A -- .audit .github/workflows/format-issue-548-remediation.yml
          git diff --cached --check
          git commit -m "fix(imports): concluir pendencias da auditoria OFX"
          git push origin "HEAD:${BRANCH_NAME}"
