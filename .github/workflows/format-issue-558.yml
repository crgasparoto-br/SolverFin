name: Format Issue 558 validator

on:
  pull_request:
    paths:
      - scripts/statement-visual/settings-interface-adversarial.mjs
      - .github/workflows/format-issue-558.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Format validator
        run: npx prettier scripts/statement-visual/settings-interface-adversarial.mjs --write

      - name: Commit formatted validator
        shell: bash
        run: |
          if git diff --quiet -- scripts/statement-visual/settings-interface-adversarial.mjs; then
            echo "Validator already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/statement-visual/settings-interface-adversarial.mjs
          git commit -m "style: format issue 558 validator"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
