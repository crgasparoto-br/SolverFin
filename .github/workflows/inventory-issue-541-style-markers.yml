name: Format final issue 541 remediation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: format-issue-541-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feat/541-ssr-style-contract
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Format final remediation files
        run: |
          npx prettier --write \
            apps/web/src/dev-server/ssr-style-contract.ts \
            apps/web/src/dev-server/ssr-style-contract.test.ts \
            scripts/validate-web-ssr-styles.mjs \
            docs/APP_SHELL.md \
            docs/DESIGN_SYSTEM.md

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/dev-server/ssr-style-contract.ts \
            apps/web/src/dev-server/ssr-style-contract.test.ts \
            scripts/validate-web-ssr-styles.mjs \
            docs/APP_SHELL.md \
            docs/DESIGN_SYSTEM.md
          git commit -m "style: format final issue 541 remediation"
          git push origin HEAD:feat/541-ssr-style-contract
