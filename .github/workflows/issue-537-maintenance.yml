name: Issue 537 maintenance patch

on:
  push:
    branches:
      - fix/537-hover-claro-controles-neutros
    paths:
      - .github/workflows/issue-537-maintenance.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/537-hover-claro-controles-neutros
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply issue 537 corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          styles_path = Path("apps/web/src/dev-server/shared-styles.ts")
          styles = styles_path.read_text(encoding="utf-8")

          replacements = {
              "button[aria-pressed]:hover:not(:disabled),": "button[aria-pressed]:not(.danger):not(.danger-action):not(.danger-menu-item):not(.danger-icon-button):hover:not(:disabled),",
              "button[aria-pressed]:focus-visible,": "button[aria-pressed]:not(.danger):not(.danger-action):not(.danger-menu-item):not(.danger-icon-button):focus-visible,",
              "button[aria-selected]:hover:not(:disabled),": "button[aria-selected]:not(.danger):not(.danger-action):not(.danger-menu-item):not(.danger-icon-button):hover:not(:disabled),",
              "button[aria-selected]:focus-visible,": "button[aria-selected]:not(.danger):not(.danger-action):not(.danger-menu-item):not(.danger-icon-button):focus-visible,",
              "button[aria-haspopup=\"listbox\"]:hover:not(:disabled),": "button[aria-haspopup=\"listbox\"]:not(.danger):not(.danger-action):not(.danger-menu-item):not(.danger-icon-button):hover:not(:disabled),",
              "button[aria-haspopup=\"listbox\"]:focus-visible,": "button[aria-haspopup=\"listbox\"]:not(.danger):not(.danger-action):not(.danger-menu-item):not(.danger-icon-button):focus-visible,",
              "button[role=\"menuitem\"]:not(.danger):not(.danger-action):not(.danger-menu-item):hover:not(:disabled),": "button[role=\"menuitem\"]:not(.danger):not(.danger-action):not(.danger-menu-item):not(.danger-icon-button):hover:not(:disabled),",
              "button[role=\"menuitem\"]:not(.danger):not(.danger-action):not(.danger-menu-item):focus-visible,": "button[role=\"menuitem\"]:not(.danger):not(.danger-action):not(.danger-menu-item):not(.danger-icon-button):focus-visible,",
              "button[data-button-variant=\"neutral\"]:hover:not(:disabled),": "button[data-button-variant=\"neutral\"]:not(.danger):not(.danger-action):not(.danger-menu-item):not(.danger-icon-button):hover:not(:disabled),",
              "button[data-button-variant=\"neutral\"]:focus-visible,": "button[data-button-variant=\"neutral\"]:not(.danger):not(.danger-action):not(.danger-menu-item):not(.danger-icon-button):focus-visible,",
              "):not(.danger):not(.danger-action):not(.danger-menu-item):hover:not(:disabled),": "):not(.danger):not(.danger-action):not(.danger-menu-item):not(.danger-icon-button):hover:not(:disabled),",
              "):not(.danger):not(.danger-action):not(.danger-menu-item):focus-visible {": "):not(.danger):not(.danger-action):not(.danger-menu-item):not(.danger-icon-button):focus-visible {",
              "button[aria-pressed=\"true\"]:hover:not(:disabled),": "button[aria-pressed=\"true\"]:not(.danger):not(.danger-action):not(.danger-menu-item):not(.danger-icon-button):hover:not(:disabled),",
              "button[aria-pressed=\"true\"]:focus-visible,": "button[aria-pressed=\"true\"]:not(.danger):not(.danger-action):not(.danger-menu-item):not(.danger-icon-button):focus-visible,",
              "button[aria-selected=\"true\"]:hover:not(:disabled),": "button[aria-selected=\"true\"]:not(.danger):not(.danger-action):not(.danger-menu-item):not(.danger-icon-button):hover:not(:disabled),",
              "button[aria-selected=\"true\"]:focus-visible {": "button[aria-selected=\"true\"]:not(.danger):not(.danger-action):not(.danger-menu-item):not(.danger-icon-button):focus-visible {",
              "    .danger-action:hover:not(:disabled) { background: #fecaca; }": "    .danger-action:hover:not(:disabled),\n    .danger-action:focus-visible { background: #fecaca; }\n    .danger-icon-button:hover:not(:disabled),\n    .danger-icon-button:focus-visible {\n      background: var(--danger-bg);\n      border-color: #fecaca;\n      color: var(--danger);\n    }",
          }

          for old, new in replacements.items():
              count = styles.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one occurrence of {old!r}, found {count}")
              styles = styles.replace(old, new, 1)

          styles_path.write_text(styles, encoding="utf-8")

          tests_path = Path("apps/web/src/dev-server/shared-styles.test.ts")
          tests = tests_path.read_text(encoding="utf-8")
          old_test = '''  it("keeps primary and destructive actions outside the neutral hover contract", () => {
    const css = sharedShellStyles();

    assert.match(css, /button:hover:not\\(:disabled\\), \\.button-link:hover \\{ background: var\\(--primary-hover\\); \\}/);
    assert.match(css, /:not\\(\\.danger\\):not\\(\\.danger-action\\):not\\(\\.danger-menu-item\\)/);
    assert.match(css, /\\.danger-action:hover:not\\(:disabled\\) \\{ background: #fecaca; \\}/);
    assert.ok(
      css.indexOf(".danger-action:hover:not(:disabled)") >
        css.indexOf("button:is("),
      "the destructive hover rule must keep precedence over neutral controls",
    );
  });'''
          new_test = '''  it("keeps primary and destructive actions outside the neutral hover contract", () => {
    const css = sharedShellStyles();

    assert.match(
      css,
      /button:hover:not\\(:disabled\\), \\.button-link:hover \\{ background: var\\(--primary-hover\\); \\}/,
    );
    assert.match(
      css,
      /:not\\(\\.danger\\):not\\(\\.danger-action\\):not\\(\\.danger-menu-item\\):not\\(\\.danger-icon-button\\)/,
    );
    assert.match(
      css,
      /\\.danger-action:hover:not\\(:disabled\\),\\s*\\.danger-action:focus-visible \\{ background: #fecaca; \\}/,
    );
  });

  it("keeps icon-only destructive controls red on hover and keyboard focus", () => {
    const css = sharedShellStyles();
    const accountsCardsSource = readFileSync(join(currentDir, "accounts-cards-page.js"), "utf8");

    assert.match(accountsCardsSource, /class="icon-button danger-icon-button"/);
    assert.match(css, /:not\\(\\.danger-icon-button\\):hover:not\\(:disabled\\)/);
    assert.match(css, /:not\\(\\.danger-icon-button\\):focus-visible/);
    assert.match(
      css,
      /\\.danger-icon-button:hover:not\\(:disabled\\),\\s*\\.danger-icon-button:focus-visible \\{\\s*background: var\\(--danger-bg\\);\\s*border-color: #fecaca;\\s*color: var\\(--danger\\);\\s*\\}/,
    );
  });'''
          if tests.count(old_test) != 1:
              raise SystemExit("Expected destructive hover test block was not found exactly once")
          tests_path.write_text(tests.replace(old_test, new_test, 1), encoding="utf-8")
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Format affected files
        run: npx prettier apps/web/src/dev-server/shared-styles.ts apps/web/src/dev-server/shared-styles.test.ts docs/BRAND.md --write

      - name: Run targeted web tests
        run: npm run test --workspace @solverfin/web

      - name: Run repository validation
        run: npm run validate

      - name: Commit validated correction
        shell: bash
        run: |
          rm .github/workflows/issue-537-maintenance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/dev-server/shared-styles.ts apps/web/src/dev-server/shared-styles.test.ts .github/workflows/issue-537-maintenance.yml
          git commit -m "fix(ui): preserve destructive icon hover semantics"
          git push origin HEAD:fix/537-hover-claro-controles-neutros
