name: Apply issue 539 implementation

on:
  push:
    branches:
      - feat/539-operational-installments

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/539-operational-installments
          fetch-depth: 0
      - name: Apply implementation patch
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/apply_issue_539.py
          python /tmp/apply_issue_539.py
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps packages docs
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat: expose operational installment metadata'
          git push origin HEAD:feat/539-operational-installments
