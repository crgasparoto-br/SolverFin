name: Fix issue 539 archived category preservation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://solverfin:solverfin_ci_password@localhost:5432/solverfin_ci?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/539-operational-installments
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Preserve an unchanged archived category
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_value: str, old: str, new: str) -> None:
              path = Path(path_value)
              content = path.read_text(encoding='utf-8')
              if content.count(old) != 1:
                  raise SystemExit(f'expected one anchor in {path_value}, found {content.count(old)}')
              path.write_text(content.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'packages/domain/src/transactions.ts',
              '  assertCategory(input.context, input.category, input.payload.categoryId, input.kind);\n',
              '''  assertCategory(
                input.context,
                input.category,
                input.payload.categoryId,
                input.kind,
                input.existingTransaction?.categoryId,
              );
              ''',
          )
          replace_once(
              'packages/domain/src/transactions.ts',
              '''  categoryId: EntityId | undefined,
            kind: TransactionKind,
          ): void {
          ''',
              '''  categoryId: EntityId | undefined,
            kind: TransactionKind,
            existingCategoryId: EntityId | undefined,
          ): void {
          ''',
          )
          replace_once(
              'packages/domain/src/transactions.ts',
              '  if (scopedCategory.status !== "active") {\n',
              '  if (scopedCategory.status !== "active" && scopedCategory.id !== existingCategoryId) {\n',
          )

          test_path = Path('packages/domain/src/transactions.test.ts')
          test_content = test_path.read_text(encoding='utf-8')
          call_anchor = 'testCategoryRemoval();\n'
          if test_content.count(call_anchor) != 1:
              raise SystemExit(f'expected one domain test call anchor, found {test_content.count(call_anchor)}')
          test_content = test_content.replace(
              call_anchor,
              call_anchor + 'testArchivedCategoryPreservedOnUnrelatedUpdate();\n',
              1,
          )
          function_anchor = 'function testTenantIsolation(): void {\n'
          new_test = '''function testArchivedCategoryPreservedOnUnrelatedUpdate(): void {
            const account = createAccountFixture(tenantA, "account-archived-category", "active");
            const category = createCategoryFixture(
              tenantA,
              "category-archived-history",
              "expense",
              "archived",
            );
            const historicalTransaction: Transaction = {
              ...createTransactionFixture(
                tenantA,
                "transaction-archived-category-history",
                "expense",
                account.id,
              ),
              categoryId: category.id,
            };
            const updated = updateTransaction({
              context: tenantA,
              transaction: historicalTransaction,
              now: "2026-06-15T11:45:00.000Z",
              account,
              category,
              payload: { description: "Descricao ajustada sem reclassificar" },
            });

            assertEqual(updated.transaction.categoryId, category.id, "preserved archived category");
            assertEqual(
              updated.transaction.description,
              "Descricao ajustada sem reclassificar",
              "updated unrelated field",
            );

            assertTransactionError(
              () =>
                updateTransaction({
                  context: tenantA,
                  transaction: createTransactionFixture(
                    tenantA,
                    "transaction-new-archived-category",
                    "expense",
                    account.id,
                  ),
                  now: "2026-06-15T11:50:00.000Z",
                  account,
                  category,
                  payload: { categoryId: category.id },
                }),
              "TRANSACTION_CATEGORY_ARCHIVED",
            );
          }

          '''
          if test_content.count(function_anchor) != 1:
              raise SystemExit(f'expected one domain test function anchor, found {test_content.count(function_anchor)}')
          test_path.write_text(test_content.replace(function_anchor, new_test + function_anchor, 1), encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Format changed files
        run: >-
          npx prettier --write
          packages/domain/src/transactions.ts
          packages/domain/src/transactions.test.ts
      - name: Validate focused domain change
        run: >-
          npm run format:check &&
          npm run lint &&
          npm run typecheck &&
          npm run test --workspace @solverfin/domain &&
          npm run test --workspace @solverfin/web &&
          npm run build
      - name: Persist archived category correction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/domain/src/transactions.ts
          git add packages/domain/src/transactions.test.ts
          git commit -m 'fix: preserve unchanged archived transaction category'
          git push origin HEAD:feat/539-operational-installments
