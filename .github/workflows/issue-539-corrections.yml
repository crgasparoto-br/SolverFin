name: Apply issue 539 corrections

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/539-operational-installments
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Correct category removal and modal restoration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              content = file.read_text(encoding='utf-8')
              if content.count(old) != 1:
                  raise SystemExit(f'expected one anchor in {path}: {old!r}')
              file.write_text(content.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'apps/api/src/repositories/installments.ts',
              'addEqualsFilter(where, params, `coalesce(t."categoryId", r."categoryId")`, filters.categoryId);',
              'addEqualsFilter(\n    where,\n    params,\n    `case when t."id" is not null then t."categoryId" else r."categoryId" end`,\n    filters.categoryId,\n  );',
          )
          replace_once(
              'apps/api/src/repositories/installments.ts',
              'on cat."id" = coalesce(t."categoryId", r."categoryId")',
              'on cat."id" = case when t."id" is not null then t."categoryId" else r."categoryId" end',
          )
          replace_once(
              'apps/web/src/dev-server/operational-installments.ts',
              'form.querySelector("[data-installment-status-message]")?.remove();\n        const saveButton',
              'form.querySelector("[data-installment-status-message]")?.remove();\n        form.querySelector("[data-installment-reload]")?.remove();\n        const saveButton',
          )
          replace_once(
              'apps/web/src/dev-server/operational-installments.ts',
              'saveButton.hidden = !editable;\n          saveButton.disabled = !editable;\n          saveButton.textContent = "Salvar parcela";\n          saveButton.dataset.installmentManaged = "";',
              'saveButton.dataset.installmentManaged = "";\n          rememberAndSet(saveButton, "hidden", !editable);\n          rememberAndSet(saveButton, "disabled", !editable);\n          saveButton.textContent = "Salvar parcela";',
          )
          replace_once(
              'apps/web/src/dev-server/operational-installments.test.ts',
              'assert.match(script, /Recarregar estado atual/);\n  assert.match(script, /stopImmediatePropagation/);',
              'assert.match(script, /Recarregar estado atual/);\n  assert.match(script, /rememberAndSet\\(saveButton, "hidden", !editable\\)/);\n  assert.match(script, /data-installment-reload/);\n  assert.match(script, /stopImmediatePropagation/);',
          )
          PY
      - name: Install dependencies
        run: npm ci
      - name: Format issue files
        run: >-
          npx prettier --write
          apps/api/src/installments-router.integration.test.ts
          apps/api/src/installments-router.ts
          apps/api/src/repositories/installments.ts
          apps/api/src/repositories/transactions.ts
          apps/web/src/dev-server/operational-installments.test.ts
          apps/web/src/dev-server/operational-installments.ts
          apps/web/src/dev-server/statement-action-icons.ts
          docs/API_INSTALLMENTS.md
          docs/CARDS.md
          docs/RECURRENCES_INSTALLMENTS_WEB.md
          docs/STATUS_MATRIX.md
          docs/TRANSACTIONS.md
          docs/WEB_MAINTENANCE_COVERAGE.md
      - name: Commit corrections
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps docs
          if git diff --cached --quiet; then
            echo 'No corrections to commit.'
            exit 0
          fi
          git commit -m 'fix: preserve installment category removal and modal state'
          git push origin HEAD:feat/539-operational-installments
