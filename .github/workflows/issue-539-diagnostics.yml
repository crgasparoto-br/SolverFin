name: Diagnose issue 539 patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/539-operational-installments
      - name: Restore patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import re

          workflow = Path('.github/workflows/issue-539-apply.yml').read_text(encoding='utf-8')
          match = re.search(r"printf '%s' '([^']+)'", workflow)
          if not match:
              raise SystemExit('embedded patch not found')
          Path('/tmp/apply_issue_539.py').write_bytes(gzip.decompress(base64.b64decode(match.group(1))))
          PY
      - name: Capture patch result
        shell: bash
        run: |
          set +e
          python /tmp/apply_issue_539.py > patch.log 2>&1
          status=$?
          echo "exit_status=$status" >> patch.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: issue-539-patch-log
          path: patch.log
