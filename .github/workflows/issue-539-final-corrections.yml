name: Apply final issue 539 corrections

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://solverfin:solverfin_ci_password@localhost:5432/solverfin_ci?schema=public
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: solverfin_ci
          POSTGRES_USER: solverfin
          POSTGRES_PASSWORD: solverfin_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solverfin -d solverfin_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/539-operational-installments
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              content = file.read_text(encoding='utf-8')
              if content.count(old) != 1:
                  raise SystemExit(f'expected one anchor in {path}: {old!r}')
              file.write_text(content.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'packages/domain/src/transactions.ts',
              'export interface UpdateTransactionPayload {\n  kind?: TransactionKind;\n  status?: TransactionStatus;\n  source?: TransactionSource;\n  amountMinor?: number;\n  currency?: string;\n  occurredOn?: ISODate;\n  plannedOn?: ISODate;\n  effectiveOn?: ISODate | null;\n  description?: string;\n  accountId?: EntityId;\n  destinationAccountId?: EntityId;\n  categoryId?: EntityId;\n  organizationId?: EntityId;\n  financialProfileId?: EntityId;\n}',
              'export interface UpdateTransactionPayload {\n  kind?: TransactionKind;\n  status?: TransactionStatus;\n  source?: TransactionSource;\n  amountMinor?: number;\n  currency?: string;\n  occurredOn?: ISODate;\n  plannedOn?: ISODate;\n  effectiveOn?: ISODate | null;\n  description?: string;\n  accountId?: EntityId;\n  destinationAccountId?: EntityId;\n  categoryId?: EntityId | null;\n  organizationId?: EntityId;\n  financialProfileId?: EntityId;\n}',
          )
          replace_once(
              'packages/domain/src/transactions.ts',
              '  const nextCategoryId = input.payload.categoryId ?? currentTransaction.categoryId;',
              '  const nextCategoryId =\n    input.payload.categoryId === null\n      ? undefined\n      : (input.payload.categoryId ?? currentTransaction.categoryId);',
          )
          replace_once(
              'apps/api/src/repositories/transactions.ts',
              '''  const removingCategory = prepared.payload.categoryId === null;\n  const domainTransaction =\n    removingCategory && currentTransaction\n      ? { ...currentTransaction, categoryId: undefined }\n      : currentTransaction;\n  const domainPayload = removingCategory\n    ? { ...prepared.payload, categoryId: undefined }\n    : prepared.payload;\n\n''',
              '',
          )
          replace_once(
              'apps/api/src/repositories/transactions.ts',
              '    transaction: domainTransaction,\n    now: new Date().toISOString(),\n    payload: domainPayload,',
              '    transaction: currentTransaction,\n    now: new Date().toISOString(),\n    payload: prepared.payload,',
          )
          replace_once(
              'apps/web/src/dev-server/operational-installments.test.ts',
              '  assert.match(script, /Parcela \\" \\+ installment\\.sequenceNumber \\+ \\" de/);',
              '  assert.match(script, /Parcela " \\+ installment\\.sequenceNumber \\+ " de/);',
          )
          replace_once(
              'packages/domain/src/transactions.test.ts',
              'testListAndUpdateTransactions();\ntestTenantIsolation();',
              'testListAndUpdateTransactions();\ntestCategoryRemoval();\ntestTenantIsolation();',
          )
          replace_once(
              'packages/domain/src/transactions.test.ts',
              '''function testTenantIsolation(): void {''',
              '''function testCategoryRemoval(): void {\n  const account = createAccountFixture(tenantA, "account-category-removal", "active");\n  const category = createCategoryFixture(\n    tenantA,\n    "category-removal",\n    "expense",\n    "active",\n  );\n  const created = createTransaction({\n    id: "transaction-category-removal",\n    context: tenantA,\n    now,\n    account,\n    category,\n    payload: {\n      kind: "expense",\n      amountMinor: 1500,\n      occurredOn: "2026-06-15",\n      accountId: account.id,\n      categoryId: category.id,\n    },\n  });\n  const updated = updateTransaction({\n    context: tenantA,\n    transaction: created.transaction,\n    now: "2026-06-15T11:30:00.000Z",\n    account,\n    payload: { categoryId: null },\n  });\n\n  assertEqual(updated.transaction.categoryId, undefined, "removed category");\n}\n\nfunction testTenantIsolation(): void {''',
          )
          PY
      - run: npm ci --no-audit --no-fund
      - name: Format corrected files
        run: >-
          npx prettier --write
          packages/domain/src/transactions.ts
          packages/domain/src/transactions.test.ts
          apps/api/src/repositories/transactions.ts
          apps/web/src/dev-server/operational-installments.test.ts
      - name: Validate corrections
        run: |
          npm run lint
          npm run typecheck
          npm run prisma:generate
          npm run db:deploy
          npm run db:seed
          npm run test --workspace @solverfin/domain
          npm run test:integration --workspace @solverfin/api
      - name: Persist corrected files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for path in \
            packages/domain/src/transactions.ts \
            packages/domain/src/transactions.test.ts \
            apps/api/src/repositories/transactions.ts \
            apps/web/src/dev-server/operational-installments.test.ts
          do
            current_sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=feat/539-operational-installments" --jq .sha)
            encoded=$(base64 -w 0 "$path")
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f message='fix: model installment category removal in domain' \
              -f branch='feat/539-operational-installments' \
              -f sha="$current_sha" \
              -f content="$encoded"
          done
