name: Apply issue 539 final polish

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://solverfin:solverfin_ci_password@localhost:5432/solverfin_ci?schema=public
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: solverfin_ci
          POSTGRES_USER: solverfin
          POSTGRES_PASSWORD: solverfin_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solverfin -d solverfin_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/539-operational-installments
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply verified final patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < .github/issue-539-final-polish.patch.gz.b64)" = "3580"
          test "$(sha256sum .github/issue-539-final-polish.patch.gz.b64 | cut -d' ' -f1)" = "59bf77481a7a4ade705123d9e82f0234d1b12ebbc4254781fe50041a7e3d330a"
          base64 -d < .github/issue-539-final-polish.patch.gz.b64 | gzip -d > /tmp/issue-539-final.patch
          test "$(wc -c < /tmp/issue-539-final.patch)" = "8463"
          test "$(sha256sum /tmp/issue-539-final.patch | cut -d' ' -f1)" = "b99161114d592f7ee4369d30ae0f9f04994c85ba05c6f8985dfd1bea7cf56ff6"
          git apply --3way --index /tmp/issue-539-final.patch
          test -z "$(git ls-files -u)"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Format final changes
        run: >-
          npx prettier --write
          apps/web/src/dev-server/operational-installments.ts
          apps/web/src/dev-server/operational-installments.test.ts
          scripts/statement-visual/issue-539-operational-installments.mjs
      - name: Validate repository
        run: npm run validate
      - name: Persist final polish
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/dev-server/operational-installments.ts
          git add apps/web/src/dev-server/operational-installments.test.ts
          git add scripts/statement-visual/issue-539-operational-installments.mjs
          git commit -m 'fix: stabilize issue 539 visual validation'
          git push origin HEAD:feat/539-operational-installments
