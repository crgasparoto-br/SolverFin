name: Apply issue 539 final polish

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://solverfin:solverfin_ci_password@localhost:5432/solverfin_ci?schema=public
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: solverfin_ci
          POSTGRES_USER: solverfin
          POSTGRES_PASSWORD: solverfin_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solverfin -d solverfin_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/539-operational-installments
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply final visual and label corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_value: str, old: str, new: str) -> None:
              path = Path(path_value)
              content = path.read_text(encoding='utf-8')
              if content.count(old) != 1:
                  raise SystemExit(f'expected one anchor in {path_value}, found {content.count(old)}')
              path.write_text(content.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'apps/web/src/dev-server/operational-installments.ts',
              '''export function buildInstallmentPatch(
          ''',
              '''export function formatInstallmentSequence(
            sequenceNumber: number,
            totalInstallments: number,
          ): string {
            return `Parcela ${sequenceNumber} de ${totalInstallments > 0 ? totalInstallments : "?"}`;
          }

          export function buildInstallmentPatch(
          ''',
          )
          replace_once(
              'apps/web/src/dev-server/operational-installments.ts',
              '''      function addBadge(row, installment) {
          ''',
              '''      function installmentLabel(installment) {
                const total = Number(installment.totalInstallments) > 0 ? installment.totalInstallments : "?";
                return "Parcela " + installment.sequenceNumber + " de " + total;
              }

              function addBadge(row, installment) {
          ''',
          )
          replace_once(
              'apps/web/src/dev-server/operational-installments.ts',
              '''        badge.textContent = "Parcela " + installment.sequenceNumber + " de " + installment.totalInstallments;
                badge.setAttribute("aria-label", "Parcela " + installment.sequenceNumber + " de " + installment.totalInstallments);
          ''',
              '''        badge.textContent = installmentLabel(installment);
                badge.setAttribute("aria-label", installmentLabel(installment));
          ''',
          )
          replace_once(
              'apps/web/src/dev-server/operational-installments.ts',
              '''        details.querySelector("[data-installment-sequence]").textContent = installment.sequenceNumber + " de " + installment.totalInstallments;
          ''',
              '''        details.querySelector("[data-installment-sequence]").textContent = installmentLabel(installment).replace("Parcela ", "");
          ''',
          )
          replace_once(
              'apps/web/src/dev-server/operational-installments.test.ts',
              '''  buildInvoiceInstallmentsPath,
          ''',
              '''  buildInvoiceInstallmentsPath,
            formatInstallmentSequence,
          ''',
          )
          replace_once(
              'apps/web/src/dev-server/operational-installments.test.ts',
              '''test("translates stable backend block reasons", () => {
          ''',
              '''test("formats unbounded recurrence installments without exposing zero as a total", () => {
            assert.equal(formatInstallmentSequence(1, 0), "Parcela 1 de ?");
            assert.equal(formatInstallmentSequence(2, 6), "Parcela 2 de 6");
          });

          test("translates stable backend block reasons", () => {
          ''',
          )
          replace_once(
              'apps/web/src/dev-server/operational-installments.test.ts',
              '''  assert.match(script, /Parcela " \\+ installment\\.sequenceNumber \\+ " de/);
          ''',
              '''  assert.match(script, /function installmentLabel\\(installment\\)/);
            assert.match(script, /installmentLabel\\(installment\\)/);
          ''',
          )
          replace_once(
              'scripts/statement-visual/issue-539-operational-installments.mjs',
              '''  await evaluate(
              browser.cdp,
              `(() => {
                const form = document.querySelector("[data-form]");
                form.description.value = ${JSON.stringify(newDescription)};
                form.querySelector('.save-row button[type="submit"]').click();
              })()`,
            );
            await sleep(900);
          ''',
              '''  const saveResult = await evaluate(
              browser.cdp,
              `(async () => {
                const form = document.querySelector("[data-form]");
                const nativeFetch = window.fetch.bind(window);
                const nativeSetTimeout = window.setTimeout.bind(window);
                let patchResult;
                window.fetch = async (...args) => {
                  const response = await nativeFetch(...args);
                  const path = String(args[0] || "");
                  const method = String(args[1]?.method || "GET").toUpperCase();
                  if (path.includes("/api/installments/") && method === "PATCH") {
                    patchResult = { status: response.status, body: await response.clone().json().catch(() => ({})) };
                  }
                  return response;
                };
                window.setTimeout = (callback, delay, ...args) => {
                  if (delay === 450 && String(callback).includes("location.reload")) return 0;
                  return nativeSetTimeout(callback, delay, ...args);
                };
                form.description.value = ${JSON.stringify(newDescription)};
                form.requestSubmit();
                for (let attempt = 0; attempt < 50 && !patchResult; attempt += 1) {
                  await new Promise((resolve) => nativeSetTimeout(resolve, 100));
                }
                window.fetch = nativeFetch;
                window.setTimeout = nativeSetTimeout;
                return {
                  patchResult,
                  statusText: form.querySelector("[data-installment-status-message]")?.textContent || ""
                };
              })()`,
            );
            check(saveResult.patchResult?.status === 200, "Installment form did not persist through PATCH", saveResult);
          ''',
          )
          replace_once(
              'scripts/statement-visual/issue-539-operational-installments.mjs',
              '''  await browser.cdp.send("Input.dispatchKeyEvent", { type: "keyDown", key: "Escape", code: "Escape" });
            await browser.cdp.send("Input.dispatchKeyEvent", { type: "keyUp", key: "Escape", code: "Escape" });
          ''',
              '''  await browser.cdp.send("Input.dispatchKeyEvent", {
              type: "rawKeyDown",
              key: "Escape",
              code: "Escape",
              windowsVirtualKeyCode: 27,
              nativeVirtualKeyCode: 27,
            });
            await browser.cdp.send("Input.dispatchKeyEvent", {
              type: "keyUp",
              key: "Escape",
              code: "Escape",
              windowsVirtualKeyCode: 27,
              nativeVirtualKeyCode: 27,
            });
          ''',
          )
          replace_once(
              'scripts/statement-visual/issue-539-operational-installments.mjs',
              '''      startOn: "2026-07-05",
                amountMinor: 12345,
          ''',
              '''      startOn: "2026-07-05",
                endOn: "2026-09-05",
                amountMinor: 12345,
          ''',
          )
          replace_once(
              'scripts/statement-visual/issue-539-operational-installments.mjs',
              '''      startOn: "2026-07-08",
                amountMinor: 2468,
          ''',
              '''      startOn: "2026-07-08",
                endOn: "2026-09-08",
                amountMinor: 2468,
          ''',
          )
          PY
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Format final changes
        run: >-
          npx prettier --write
          apps/web/src/dev-server/operational-installments.ts
          apps/web/src/dev-server/operational-installments.test.ts
          scripts/statement-visual/issue-539-operational-installments.mjs
      - name: Validate repository
        run: npm run validate
      - name: Persist final polish
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/dev-server/operational-installments.ts
          git add apps/web/src/dev-server/operational-installments.test.ts
          git add scripts/statement-visual/issue-539-operational-installments.mjs
          git commit -m 'fix: stabilize issue 539 visual validation'
          git push origin HEAD:feat/539-operational-installments
