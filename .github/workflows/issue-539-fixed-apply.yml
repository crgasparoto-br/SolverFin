name: Apply fixed issue 539 patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/539-operational-installments
          fetch-depth: 0
      - name: Restore and fix patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import re

          workflow = Path('.github/workflows/issue-539-apply.yml').read_text(encoding='utf-8')
          match = re.search(r"printf '%s' '([^']+)'", workflow)
          if not match:
              raise SystemExit('embedded patch not found')

          patch = Path('/tmp/apply_issue_539.py')
          patch.write_bytes(gzip.decompress(base64.b64decode(match.group(1))))
          source = patch.read_text(encoding='utf-8')
          old = '''replace_once(
    "apps/api/src/repositories/installments.ts",
    "  categoryId?: EntityId;\\n}",
    "  categoryId?: EntityId | null;\\n}",
)'''
          new = '''replace_once(
    "apps/api/src/repositories/installments.ts",
    "export interface UpdateInstallmentPayload {\\n  description?: string;\\n  note?: string | null;\\n  categoryId?: EntityId;\\n}",
    "export interface UpdateInstallmentPayload {\\n  description?: string;\\n  note?: string | null;\\n  categoryId?: EntityId | null;\\n}",
)'''
          if old not in source:
              raise SystemExit('old patch anchor not found')
          patch.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Run patch
        shell: bash
        run: |
          set +e
          python /tmp/apply_issue_539.py > patch.log 2>&1
          status=$?
          set -e
          echo "$status" > patch.status
          cat patch.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-539-fixed-patch-log
          path: |
            patch.log
            patch.status
      - name: Commit implementation
        shell: bash
        run: |
          status=$(cat patch.status)
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps packages docs
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat: expose operational installment metadata'
          git push origin HEAD:feat/539-operational-installments
