name: Issue 539 source export

on:
  push:
    branches:
      - feat/539-operational-installments

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package repository checkout
        shell: bash
        run: |
          tar --exclude=.git -czf solverfin-issue-539-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: solverfin-issue-539-source-${{ github.sha }}
          path: solverfin-issue-539-source.tar.gz
          if-no-files-found: error
          retention-days: 1
