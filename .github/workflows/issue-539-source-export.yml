name: Apply issue 539 remediation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://solverfin:solverfin_ci_password@localhost:5432/solverfin_ci?schema=public
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: solverfin_ci
          POSTGRES_USER: solverfin
          POSTGRES_PASSWORD: solverfin_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solverfin -d solverfin_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/539-operational-installments
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply audited remediation
        shell: bash
        run: |
          set -euo pipefail
          cat .github/issue-539-remediation/part-* > /tmp/issue-539.patch.gz.b64
          python - <<'PY'
          from pathlib import Path

          path = Path('/tmp/issue-539.patch.gz.b64')
          content = path.read_text(encoding='utf-8')
          broken = 'SczpnhLgRN2'
          corrected = 'SczpnhhLgRN2'
          if content.count(broken) != 1:
              raise SystemExit(f'expected one transport anchor, found {content.count(broken)}')
          path.write_text(content.replace(broken, corrected, 1), encoding='utf-8')
          PY
          test "$(wc -c < /tmp/issue-539.patch.gz.b64)" = "18580"
          test "$(sha256sum /tmp/issue-539.patch.gz.b64 | cut -d' ' -f1)" = "97db1336a5ae7d8f24fb85d18d634272b9012fb7e706e90c21398aa74843d814"
          base64 -d < /tmp/issue-539.patch.gz.b64 | gzip -d > /tmp/issue-539.patch
          test "$(wc -c < /tmp/issue-539.patch)" = "52321"
          test "$(sha256sum /tmp/issue-539.patch | cut -d' ' -f1)" = "e781d38deefedb6a205ffde52761a7f057f590d79726459facddc6e687a9214d"
          git apply --check /tmp/issue-539.patch
          git apply --index /tmp/issue-539.patch
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Format remediation
        run: >-
          npx prettier --write
          README.md
          apps/api/src/installments-router.integration.test.ts
          apps/api/src/repositories/installments.ts
          apps/api/src/repositories/transactions.ts
          apps/api/src/router.ts
          apps/web/src/dev-server/operational-installments.test.ts
          apps/web/src/dev-server/operational-installments.ts
          docs/API_INSTALLMENTS.md
          docs/ARCHITECTURE.md
          docs/RECURRENCES_INSTALLMENTS_WEB.md
          docs/STATUS_MATRIX.md
          docs/TRANSACTIONS.md
          docs/WEB_MAINTENANCE_COVERAGE.md
          scripts/run-statement-visual-validation.mjs
          scripts/statement-visual/issue-539-operational-installments.mjs
      - name: Validate repository
        shell: bash
        run: |
          set +e
          npm run validate > /tmp/issue-539-validate.log 2>&1
          status=$?
          printf '%s\n' "$status" > /tmp/issue-539-validate.status
          tail -n 120 /tmp/issue-539-validate.log
          exit 0
      - name: Upload validation diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-539-validation-diagnostic-${{ github.sha }}
          path: |
            /tmp/issue-539-validate.log
            /tmp/issue-539-validate.status
          if-no-files-found: error
          retention-days: 1
      - name: Assert repository validation
        run: test "$(cat /tmp/issue-539-validate.status)" = "0"
      - name: Validate PostgreSQL integration
        shell: bash
        run: |
          set +e
          npm run test:integration > /tmp/issue-539-integration.log 2>&1
          status=$?
          printf '%s\n' "$status" > /tmp/issue-539-integration.status
          tail -n 120 /tmp/issue-539-integration.log
          exit 0
      - name: Upload integration diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-539-integration-diagnostic-${{ github.sha }}
          path: |
            /tmp/issue-539-integration.log
            /tmp/issue-539-integration.status
          if-no-files-found: warn
          retention-days: 1
      - name: Assert PostgreSQL integration
        run: test "$(cat /tmp/issue-539-integration.status)" = "0"
      - name: Persist remediation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add scripts/statement-visual/issue-539-operational-installments.mjs
          git commit -m 'fix: close issue 539 audit findings'
          git push origin HEAD:feat/539-operational-installments
