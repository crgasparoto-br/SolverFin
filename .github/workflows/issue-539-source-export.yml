name: Issue 539 source export

on:
  push:
    branches:
      - feat/539-operational-installments
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Package repository checkout
        shell: bash
        run: |
          tar -czf /tmp/solverfin-issue-539-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: solverfin-issue-539-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/solverfin-issue-539-source.tar.gz
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
