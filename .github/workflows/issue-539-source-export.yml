name: Apply issue 539 remediation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://solverfin:solverfin_ci_password@localhost:5432/solverfin_ci?schema=public
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: solverfin_ci
          POSTGRES_USER: solverfin
          POSTGRES_PASSWORD: solverfin_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solverfin -d solverfin_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/539-operational-installments
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply audited remediation
        shell: bash
        run: |
          set +e
          {
            cat .github/issue-539-remediation/part-* > /tmp/issue-539.patch.gz.b64
            echo "payload-bytes=$(wc -c < /tmp/issue-539.patch.gz.b64)"
            sha256sum /tmp/issue-539.patch.gz.b64
            base64 -d < /tmp/issue-539.patch.gz.b64 > /tmp/issue-539.patch.gz
            echo "base64-status=$?"
            gzip -t /tmp/issue-539.patch.gz
            echo "gzip-status=$?"
            gzip -dc /tmp/issue-539.patch.gz > /tmp/issue-539.patch
            echo "patch-bytes=$(wc -c < /tmp/issue-539.patch)"
            git apply --check /tmp/issue-539.patch
            echo "apply-check-status=$?"
            git apply --index /tmp/issue-539.patch
            echo "apply-status=$?"
          } > /tmp/issue-539-remediation.log 2>&1
          status=$?
          printf '%s\n' "$status" > /tmp/issue-539-remediation.status
          cat /tmp/issue-539-remediation.log
          exit 0
      - name: Upload remediation diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-539-remediation-diagnostic-${{ github.sha }}
          path: |
            /tmp/issue-539-remediation.log
            /tmp/issue-539-remediation.status
            /tmp/issue-539.patch
          if-no-files-found: warn
          retention-days: 1
      - name: Assert remediation applied
        shell: bash
        run: |
          test "$(cat /tmp/issue-539-remediation.status)" = "0"
          git diff --cached --quiet && { echo "Remediation produced no staged changes"; exit 1; } || true
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Format remediation
        run: >-
          npx prettier --write
          README.md
          apps/api/src/installments-router.integration.test.ts
          apps/api/src/repositories/installments.ts
          apps/api/src/repositories/transactions.ts
          apps/api/src/router.ts
          apps/web/src/dev-server/operational-installments.test.ts
          apps/web/src/dev-server/operational-installments.ts
          docs/API_INSTALLMENTS.md
          docs/ARCHITECTURE.md
          docs/RECURRENCES_INSTALLMENTS_WEB.md
          docs/STATUS_MATRIX.md
          docs/TRANSACTIONS.md
          docs/WEB_MAINTENANCE_COVERAGE.md
          scripts/run-statement-visual-validation.mjs
          scripts/statement-visual/issue-539-operational-installments.mjs
      - name: Validate repository
        run: npm run validate
      - name: Validate PostgreSQL integration
        run: npm run test:integration
      - name: Persist remediation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add scripts/statement-visual/issue-539-operational-installments.mjs
          git commit -m 'fix: close issue 539 audit findings'
          git push origin HEAD:feat/539-operational-installments
