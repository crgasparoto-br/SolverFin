name: Fix issue 539 visual fixture

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/539-operational-installments
          fetch-depth: 0
      - name: Select deterministic July installments
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/statement-visual/issue-539-operational-installments.mjs')
          content = path.read_text(encoding='utf-8')
          replacements = {
              'const accountInstallment = accountInstallments.find((item) => item.transaction?.id);': 'const accountInstallment = accountInstallments.find(\n      (item) => item.dueOn === "2026-07-05" && item.transaction?.id,\n    );',
              'const cardInstallment = cardInstallments.find((item) => item.transaction?.invoiceId);': 'const cardInstallment = cardInstallments.find(\n      (item) => item.dueOn === "2026-07-08" && item.transaction?.invoiceId,\n    );',
          }
          for old, new in replacements.items():
              if content.count(old) != 1:
                  raise SystemExit(f'expected one visual fixture anchor, found {content.count(old)}: {old}')
              content = content.replace(old, new, 1)
          path.write_text(content, encoding='utf-8')
          PY
          node --check scripts/statement-visual/issue-539-operational-installments.mjs
      - name: Persist visual fixture correction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/statement-visual/issue-539-operational-installments.mjs
          git commit -m 'test: stabilize issue 539 visual fixture'
          git push origin HEAD:feat/539-operational-installments
