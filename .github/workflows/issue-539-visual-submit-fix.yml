name: Fix issue 539 visual submit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/539-operational-installments
          fetch-depth: 0
      - name: Dispatch the restricted form submit directly
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/statement-visual/issue-539-operational-installments.mjs')
          content = path.read_text(encoding='utf-8')
          old = '      form.requestSubmit();\n'
          new = '      form.dispatchEvent(new Event("submit", { bubbles: true, cancelable: true }));\n'
          if content.count(old) != 1:
              raise SystemExit(f'expected one submit anchor, found {content.count(old)}')
          path.write_text(content.replace(old, new, 1), encoding='utf-8')
          PY
          node --check scripts/statement-visual/issue-539-operational-installments.mjs
      - name: Persist visual submit correction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/statement-visual/issue-539-operational-installments.mjs
          git commit -m 'test: dispatch issue 539 restricted form submit'
          git push origin HEAD:feat/539-operational-installments
