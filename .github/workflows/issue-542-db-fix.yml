name: Issue 542 database contract fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: issue-542-db-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-fix:
    name: Apply PostgreSQL enum normalization
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply database contract fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/api/src/category-evolution-report.ts")
          content = path.read_text()
          replacements = {
              'select "id", "parentCategoryId", "name", "kind", "status"': 'select "id", "parentCategoryId", "name",\n              lower("kind"::text) as "kind",\n              lower("status"::text) as "status"',
              'movement."kind",\n              movement."currency"': 'lower(movement."kind"::text) as "kind",\n              movement."currency"',
              'movement."kind" in (\'income\', \'expense\')': 'movement."kind" in (\'INCOME\', \'EXPENSE\')',
              'movement."status" in (\'posted\', \'reconciled\')': 'movement."status" in (\'POSTED\', \'RECONCILED\')',
          }
          for before, after in replacements.items():
              if before not in content:
                  raise SystemExit(f"expected source fragment not found: {before}")
              content = content.replace(before, after, 1)
          path.write_text(content)
          PY
          npm run format
          rm .github/workflows/issue-542-db-fix.yml

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(reports): normalize PostgreSQL enum values"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
