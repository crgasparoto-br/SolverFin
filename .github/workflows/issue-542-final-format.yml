name: Issue 542 final formatting

on:
  push:
    branches:
      - feat/542-category-evolution-report

permissions:
  contents: write

concurrency:
  group: issue-542-final-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Apply repository formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Format and remove workflow
        run: |
          npm run format
          rm .github/workflows/issue-542-final-format.yml

      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(reports): apply final repository formatting"
          git push origin HEAD:feat/542-category-evolution-report
