name: Issue 542 interval patch

on:
  push:
    branches:
      - feat/542-category-evolution-report

permissions:
  contents: write

concurrency:
  group: issue-542-interval-patch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-patch:
    name: Apply interval patch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply interval patch
        run: |
          python .github/scripts/issue-542-interval-fix.py
          npm run format
          rm .github/workflows/issue-542-format-patch.yml
          rm .github/workflows/issue-542-interval-fix.yml
          rm .github/scripts/issue-542-interval-fix.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(reports): switch intervals without JavaScript"
          git push origin HEAD:feat/542-category-evolution-report
