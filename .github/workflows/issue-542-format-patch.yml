name: Issue 542 format patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: issue-542-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-patch:
    name: Apply Prettier patch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Format and remove temporary workflow
        run: |
          npm run format
          rm .github/workflows/issue-542-format-patch.yml

      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(reports): apply repository formatting"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
