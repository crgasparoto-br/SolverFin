name: Issue 548 CSV regression remediation

on:
  push:
    branches:
      - feat/548-ofx-inbox-import

permissions:
  contents: write

jobs:
  patch-router:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/548-ofx-inbox-import
          fetch-depth: 0

      - name: Separate CSV and OFX content boundaries
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/api/src/import-batches-router.ts")
          text = path.read_text(encoding="utf-8")

          def replace_content_reader(source: str, function_name: str) -> str:
              marker = f"async function {function_name}("
              start = source.index(marker)
              end = source.index("\n}\n", start) + 3
              block = source[start:end]
              old = 'content: requireString(body, "content"),'
              if block.count(old) != 1:
                  raise RuntimeError(f"Unexpected content reader in {function_name}")
              block = block.replace(old, 'content: requireRawString(body, "content"),', 1)
              return source[:start] + block + source[end:]

          text = replace_content_reader(text, "previewOfxImportBatchHandler")
          text = replace_content_reader(text, "createOfxImportBatchHandler")

          helper_start = text.index("function requireString(")
          helper_end = text.index("\n}\n", helper_start) + 3
          old_helper = text[helper_start:helper_end]
          if 'if (key === "content") return value;' not in old_helper:
              raise RuntimeError("Expected shared raw-content exception was not found")

          new_helper = '''function requireString(body: Record<string, unknown>, key: string): string {
            const value = body[key];
            if (typeof value !== "string" || value.trim().length === 0) {
              throw new ImportReviewError(
                "IMPORT_FIELD_REQUIRED",
                `Campo ${key} e obrigatorio para continuar.`,
              );
            }
            return value.trim();
          }

          function requireRawString(body: Record<string, unknown>, key: string): string {
            const value = body[key];
            if (typeof value !== "string") {
              throw new ImportReviewError(
                "IMPORT_FIELD_REQUIRED",
                `Campo ${key} e obrigatorio para continuar.`,
              );
            }
            return value;
          }
          '''
          text = text[:helper_start] + new_helper + text[helper_end:]
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/import-batches-router.ts
          git diff --cached --check
          git commit -m "fix(imports): preserve CSV boundary contract"
          git push origin HEAD:feat/548-ofx-inbox-import
