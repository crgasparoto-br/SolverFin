name: Issue 548 format artifact

on:
  push:
    branches:
      - feat/548-ofx-inbox-import
    paths:
      - .github/workflows/issue-548-format.yml

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format remediation files
        run: >-
          npx prettier
          apps/api/src/repositories/ofx-import-amount.ts
          apps/api/src/ofx-import-amount-precision.integration.test.ts
          --write
      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: issue-548-formatted
          path: |
            apps/api/src/repositories/ofx-import-amount.ts
            apps/api/src/ofx-import-amount-precision.integration.test.ts
          if-no-files-found: error
          retention-days: 1
