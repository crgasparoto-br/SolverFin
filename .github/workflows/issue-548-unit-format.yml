name: Issue 548 unit format artifact

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/issue-548-unit-format.yml

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format unit test
        run: npx prettier apps/api/src/ofx-import-amount-precision.test.ts --write
      - name: Upload formatted file
        uses: actions/upload-artifact@v4
        with:
          name: issue-548-unit-formatted
          path: apps/api/src/ofx-import-amount-precision.test.ts
          if-no-files-found: error
          retention-days: 1
