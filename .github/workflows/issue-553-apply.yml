name: Apply issue 553 candidate

on:
  push:
    branches:
      - feat/553-canonical-manual-installments
    paths:
      - ".issue-553/**"
      - ".github/workflows/issue-553-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reconstruct and apply candidate
        shell: bash
        run: |
          cat .issue-553/apply.part.* | base64 -d | gzip -d > /tmp/issue-553-apply.mjs
          node /tmp/issue-553-apply.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Format candidate
        shell: bash
        run: |
          npx prettier --write \
            prisma/schema.prisma \
            prisma/migrations/20260731123000_manual_installment_creation/migration.sql \
            apps/api/src/installments-router.ts \
            apps/api/src/repositories/manual-installments.ts \
            apps/api/src/manual-installments.test.ts \
            apps/api/src/manual-installments.integration.test.ts \
            apps/web/src/dev-server/transactions-page.ts \
            apps/web/src/dev-server/transactions-statement.ts \
            apps/web/src/dev-server/manual-installments-source.test.ts \
            docs/API_INSTALLMENTS.md \
            docs/API_TRANSACTIONS.md \
            docs/RECURRENCES_INSTALLMENTS_WEB.md \
            docs/TRANSACTIONS.md \
            docs/STATUS_MATRIX.md \
            docs/ARCHITECTURE.md \
            docs/adr/0007-durable-financial-set-idempotency.md \
            docs/adr/README.md

      - name: Remove temporary delivery files
        shell: bash
        run: |
          rm -rf .issue-553
          rm -f .github/workflows/issue-553-apply.yml
          rm -f /tmp/issue-553-apply.mjs

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(installments): create canonical manual installments"
          git push origin HEAD:feat/553-canonical-manual-installments
