name: Apply issue 553 candidate

on:
  push:
    branches:
      - feat/553-canonical-manual-installments
    paths:
      - ".issue-553/**"
      - ".github/workflows/issue-553-apply.yml"
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/553-canonical-manual-installments
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reconstruct and apply candidate
        shell: bash
        run: |
          cat .issue-553/apply.part.* | base64 -d | gzip -d > /tmp/issue-553-apply.mjs
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/issue-553-apply.mjs')
          source = path.read_text()
          old = '''    "  transactionGroups   TransactionGroup[]\\n",
              "  transactionGroups            TransactionGroup[]\\n  installmentCreationRequests InstallmentCreationRequest[]\\n",
          '''
          new = '''    "  auditLogs           AuditLogEntry[]\\n  transactionGroups   TransactionGroup[]\\n",
              "  auditLogs                    AuditLogEntry[]\\n  transactionGroups            TransactionGroup[]\\n  installmentCreationRequests  InstallmentCreationRequest[]\\n",
          '''
          if source.count(old) != 1:
              raise SystemExit(f'expected one schema marker, found {source.count(old)}')
          path.write_text(source.replace(old, new))
          PY
          node /tmp/issue-553-apply.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Format candidate
        shell: bash
        run: |
          DATABASE_URL=postgresql://solverfin:solverfin@localhost:5432/solverfin npx prisma format --schema prisma/schema.prisma
          npx prettier --write \
            apps/api/src/installments-router.ts \
            apps/api/src/repositories/manual-installments.ts \
            apps/api/src/manual-installments.test.ts \
            apps/api/src/manual-installments.integration.test.ts \
            apps/web/src/dev-server/transactions-page.ts \
            apps/web/src/dev-server/transactions-statement.ts \
            apps/web/src/dev-server/manual-installments-web.test.ts \
            docs/API_INSTALLMENTS.md \
            docs/API_TRANSACTIONS.md \
            docs/RECURRENCES_INSTALLMENTS_WEB.md \
            docs/TRANSACTIONS.md \
            docs/STATUS_MATRIX.md \
            docs/ARCHITECTURE.md \
            docs/adr/0007-durable-financial-set-idempotency.md \
            docs/adr/README.md

      - name: Remove temporary delivery files
        shell: bash
        run: |
          rm -rf .issue-553
          rm -f .github/workflows/issue-553-apply.yml
          rm -f /tmp/issue-553-apply.mjs

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(installments): create canonical manual installments"
          git push origin HEAD:feat/553-canonical-manual-installments
