name: Remediate issue 553 candidate

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: issue-553-remediate
  cancel-in-progress: true

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/553-canonical-manual-installments
          fetch-depth: 0

      - name: Patch TypeScript contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/api/src/repositories/manual-installments.ts')
          source = path.read_text()

          old_optional = '''        account,
        destinationAccount,
        category,
'''
          new_optional = '''        ...(account ? { account } : {}),
        ...(destinationAccount ? { destinationAccount } : {}),
        ...(category ? { category } : {}),
'''
          if source.count(old_optional) != 1:
              raise SystemExit(f'optional input marker count: {source.count(old_optional)}')
          source = source.replace(old_optional, new_optional)

          old_audit = '''    redactedChanges: {
      sequenceNumber: input.sequenceNumber,
      totalInstallments: input.totalInstallments,
      amountMode: input.amountMode,
      origin: "manual_statement",
    },
'''
          new_audit = '''    redactedChanges: {
      sequenceNumber: "added",
      totalInstallments: "added",
      amountMode: "added",
      origin: "added",
    },
'''
          if source.count(old_audit) != 1:
              raise SystemExit(f'audit marker count: {source.count(old_audit)}')
          path.write_text(source.replace(old_audit, new_audit))
          PY

      - name: Install and format
        run: |
          npm ci --no-audit --no-fund
          npx prettier --write apps/api/src/repositories/manual-installments.ts

      - name: Commit remediation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/repositories/manual-installments.ts
          git commit -m "fix(installments): align domain and audit contracts"
          git push origin HEAD:feat/553-canonical-manual-installments
