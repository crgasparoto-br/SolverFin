name: Issue 604 formatter helper

on:
  push:
    branches:
      - issue-604-legacy-html-post-processors

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Format issue 604 files
        run: >-
          npx prettier --write
          apps/web/src/dev-server/legacy-html-post-processors.ts
          docs/LEGACY_HTML_POST_PROCESSORS.md
          scripts/validate-legacy-html-post-processors.mjs
      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: issue-604-prettier
          path: |
            apps/web/src/dev-server/legacy-html-post-processors.ts
            docs/LEGACY_HTML_POST_PROCESSORS.md
            scripts/validate-legacy-html-post-processors.mjs
          if-no-files-found: error
