name: Issue 608 formatter helper

on:
  push:
    branches:
      - codex/608-dashboard-cockpit-multicurrency
    paths:
      - .github/workflows/issue-608-format-helper.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/608-dashboard-cockpit-multicurrency
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Format Issue 608 files
        run: >-
          npx prettier --write
          apps/api/src/financial-summary-multi-currency.integration.test.ts
          apps/api/src/repositories/dashboard.ts
          apps/web/src/dev-server/dashboard-drilldown-currency.test.ts
          apps/web/src/dev-server/dashboard-page-currency.test.ts
          apps/web/src/dev-server/dashboard-page.test.ts
          apps/web/src/dev-server/dashboard-page.ts
          apps/web/src/dev-server/dashboard-presenter.test.ts
          apps/web/src/dev-server/dashboard-presenter.ts
          apps/web/src/dev-server/transactions-statement.ts
          docs/DASHBOARD.md

      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/financial-summary-multi-currency.integration.test.ts \
            apps/api/src/repositories/dashboard.ts \
            apps/web/src/dev-server/dashboard-drilldown-currency.test.ts \
            apps/web/src/dev-server/dashboard-page-currency.test.ts \
            apps/web/src/dev-server/dashboard-page.test.ts \
            apps/web/src/dev-server/dashboard-page.ts \
            apps/web/src/dev-server/dashboard-presenter.test.ts \
            apps/web/src/dev-server/dashboard-presenter.ts \
            apps/web/src/dev-server/transactions-statement.ts \
            docs/DASHBOARD.md
          git commit -m "style(608): apply repository prettier"
          git push origin HEAD:codex/608-dashboard-cockpit-multicurrency
