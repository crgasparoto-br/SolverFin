name: Issue 609 remediation helper

on:
  push:
    branches:
      - codex/609-statement-account-currency

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://solverfin:solverfin_dev_password@localhost:5432/solverfin?schema=public

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: solverfin
          POSTGRES_USER: solverfin
          POSTGRES_PASSWORD: solverfin_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solverfin -d solverfin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply targeted remediation
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          function replaceExactly(path, before, after) {
            const source = fs.readFileSync(path, "utf8");
            const count = source.split(before).length - 1;
            if (count !== 1) throw new Error(`${path}: expected exactly one match, found ${count}`);
            fs.writeFileSync(path, source.replace(before, after));
          }

          replaceExactly(
            "apps/web/src/dev-server/recurrences-section.ts",
            '  cardInstrumentOptions = "",\n): string {',
            '  cardInstrumentOptions = "",\n  amountCurrencyLabel = "R$",\n): string {',
          );
          replaceExactly(
            "apps/web/src/dev-server/recurrences-section.ts",
            '          <label>Valor (R$)<input name="amountMinor" data-money inputmode="decimal" placeholder="0,00" /></label>',
            '          <label>Valor (${escapeHtml(amountCurrencyLabel)})<input name="amountMinor" data-money inputmode="decimal" placeholder="0,00" /></label>',
          );
          replaceExactly(
            "apps/web/src/dev-server/transactions-page-v2.ts",
            '    ${renderRecurrenceEditModal(categories, "account")}',
            '    ${renderRecurrenceEditModal(categories, "account", "", currency ?? "moeda indisponível")}',
          );
          NODE

          npx prettier --write \
            apps/web/src/dev-server/recurrences-section.ts \
            apps/web/src/dev-server/transactions-page-v2.ts \
            apps/web/src/dev-server/ssr-style-contract.test.ts

      - name: Check formatting
        run: npm run format:check

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply migrations
        run: npm run db:deploy

      - name: Seed demo data
        run: npm run db:seed

      - name: Run official test gate
        run: npm run test

      - name: Upload validated source files
        uses: actions/upload-artifact@v4
        with:
          name: issue-609-validated-source
          path: |
            apps/web/src/dev-server/recurrences-section.ts
            apps/web/src/dev-server/transactions-page-v2.ts
            apps/web/src/dev-server/ssr-style-contract.test.ts
          retention-days: 1
