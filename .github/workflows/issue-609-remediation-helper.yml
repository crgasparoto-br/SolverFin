name: Issue 609 remediation helper

on:
  push:
    branches:
      - codex/609-statement-account-currency

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/609-statement-account-currency

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run repository tests with diagnostic capture
        id: repository-tests
        continue-on-error: true
        run: |
          set -o pipefail
          npm test 2>&1 | tee issue-609-test.log

      - name: Upload test diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-609-test-diagnostic
          path: issue-609-test.log
          if-no-files-found: error

      - name: Preserve test outcome
        if: steps.repository-tests.outcome == 'failure'
        run: exit 1
