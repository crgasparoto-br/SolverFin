name: Issue 609 remediation helper

on:
  push:
    branches:
      - codex/609-statement-account-currency

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/609-statement-account-currency

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build packages
        run: npm run build:packages

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build