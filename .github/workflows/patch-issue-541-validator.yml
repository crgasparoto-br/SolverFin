name: Patch issue 541 validator

on:
  push:
    branches:
      - feat/541-ssr-style-contract

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/541-ssr-style-contract
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply validator corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          contract = Path('apps/web/src/dev-server/ssr-style-contract.ts')
          text = contract.read_text()
          text = text.replace(
              "representativeHtmlFragments: ['class=\"secondary-heading\"']",
              "representativeHtmlFragments: ['class=\"page-heading secondary-heading\"']",
          )
          text = text.replace(
              'return providerCss.length === 0 ? html : html.replace(providerCss, "");',
              'return providerCss.length === 0 ? html : html.split(providerCss).join("");',
          )
          contract.write_text(text)

          validator = Path('scripts/validate-web-ssr-styles.mjs')
          text = validator.read_text()
          text = text.replace(
              '["/api/categories", { categories: [] }],',
              '["/api/categories", { categories: [] }],\n    ["/api/budgets", { budgets: [] }],',
          )
          text = text.replace('html: html.replace(fragment, ""),', 'html: removeAllOccurrences(html, fragment),')
          text = text.replace(
              'html: html.replace(conditional.triggerHtmlFragment, ""),',
              'html: removeAllOccurrences(html, conditional.triggerHtmlFragment),',
          )
          text = text.replace(
              'function emptyStyleBlockByMarker(html, marker) {',
              'function removeAllOccurrences(value, fragment) {\n  return fragment.length === 0 ? value : value.split(fragment).join("");\n}\n\nfunction emptyStyleBlockByMarker(html, marker) {',
          )
          validator.write_text(text)
          PY

      - name: Verify patch
        run: |
          grep -F 'class="page-heading secondary-heading"' apps/web/src/dev-server/ssr-style-contract.ts
          grep -F '["/api/budgets", { budgets: [] }]' scripts/validate-web-ssr-styles.mjs
          grep -F 'removeAllOccurrences' scripts/validate-web-ssr-styles.mjs

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/dev-server/ssr-style-contract.ts scripts/validate-web-ssr-styles.mjs
          git commit -m "fix(web): make SSR negative controls exhaustive"
          git push origin HEAD:feat/541-ssr-style-contract
