# Protected default-branch, read-only packet exporter. Does not approve PRs.
name: Prepare neutral audit packet (bootstrap)
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read
  checks: read
jobs:
  packet:
    name: Export authenticated neutral sources
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.event.issue.pull_request &&
      github.event.comment.body == '/solverit-audit-packet'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted workflow source, never candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Collect read-only exact-SHA facts
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PACKET_OUTPUT: ${{ runner.temp }}/neutral-audit/review-packet.json
        run: python scripts/prepare_session_review_packet.py --repo "$REPOSITORY" --event "$GITHUB_EVENT_PATH" --output "$PACKET_OUTPUT"
      - name: Upload neutral sources, not an approval
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solverfin-neutral-audit-packet
          path: ${{ runner.temp }}/neutral-audit/review-packet.json
          if-no-files-found: error
          retention-days: 14
