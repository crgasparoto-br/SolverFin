name: Remediate Issue 558 ARIA

on:
  pull_request:
    paths:
      - apps/web/src/dev-server/settings-page.ts
      - .github/workflows/remediate-issue-558-aria.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Repair invalid field ARIA state
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/web/src/dev-server/settings-page.ts")
          source = path.read_text()
          old = '''          input.toggleAttribute("aria-invalid", invalid);
          if (error) error.hidden = !invalid;'''
          new = '''          if (invalid) input.setAttribute("aria-invalid", "true");
          else input.removeAttribute("aria-invalid");
          if (error) error.hidden = !invalid;'''
          if old not in source:
              if new in source:
                  print("ARIA invalid state already repaired.")
              else:
                  raise SystemExit("Expected decimal validation block was not found.")
          else:
              source = source.replace(old, new, 1)
          path.write_text(source)

      - name: Format repository file
        run: npx prettier apps/web/src/dev-server/settings-page.ts --write

      - name: Commit ARIA remediation
        shell: bash
        run: |
          if git diff --quiet -- apps/web/src/dev-server/settings-page.ts; then
            echo "ARIA remediation already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/dev-server/settings-page.ts
          git commit -m "fix: associar erro decimal ao campo"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
