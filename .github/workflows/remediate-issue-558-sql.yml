name: Remediate Issue 558 SQL

on:
  pull_request:
    paths:
      - apps/api/src/repositories/automation-rules.ts
      - .github/workflows/remediate-issue-558-sql.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Repair contiguous update parameters
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/api/src/repositories/automation-rules.ts")
          source = path.read_text()
          old = '''  await query(
              `update "AutomationRule" set
                 "name" = $4, "status" = $5, "priority" = $6, "conditions" = $7::jsonb, "actions" = $8::jsonb,
                 "explanation" = $9, "updatedByUserId" = $11, "updatedAt" = $13
               where "id" = $1 and "organizationId" = $2 and "financialProfileId" = $3`,
              buildAutomationRuleParams(updated),
            );'''
          new = '''  await query(
              `update "AutomationRule" set
                 "name" = $4, "status" = $5, "priority" = $6, "conditions" = $7::jsonb, "actions" = $8::jsonb,
                 "explanation" = $9, "updatedByUserId" = $10, "updatedAt" = $11
               where "id" = $1 and "organizationId" = $2 and "financialProfileId" = $3`,
              buildAutomationRuleUpdateParams(updated),
            );'''
          if old not in source:
              if new in source:
                  print("SQL update already repaired.")
              else:
                  raise SystemExit("Expected AutomationRule update block was not found.")
          else:
              source = source.replace(old, new, 1)

          marker = '''function buildAutomationRuleParams(rule: AutomationRule): unknown[] {
            return [
              rule.id,
              rule.organizationId,
              rule.financialProfileId,
              rule.name,
              rule.status.toUpperCase(),
              rule.priority,
              JSON.stringify(rule.conditions),
              JSON.stringify(rule.actions),
              rule.explanation ?? null,
              rule.createdByUserId ?? null,
              rule.updatedByUserId ?? null,
              rule.createdAt,
              rule.updatedAt,
            ];
          }
          '''
          helper = marker + '''
          function buildAutomationRuleUpdateParams(rule: AutomationRule): unknown[] {
            return [
              rule.id,
              rule.organizationId,
              rule.financialProfileId,
              rule.name,
              rule.status.toUpperCase(),
              rule.priority,
              JSON.stringify(rule.conditions),
              JSON.stringify(rule.actions),
              rule.explanation ?? null,
              rule.updatedByUserId ?? null,
              rule.updatedAt,
            ];
          }
          '''
          if "function buildAutomationRuleUpdateParams" not in source:
              if marker not in source:
                  raise SystemExit("Expected AutomationRule parameter helper was not found.")
              source = source.replace(marker, helper, 1)

          path.write_text(source)

      - name: Format repository file
        run: npx prettier apps/api/src/repositories/automation-rules.ts --write

      - name: Commit SQL remediation
        shell: bash
        run: |
          if git diff --quiet -- apps/api/src/repositories/automation-rules.ts; then
            echo "SQL remediation already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/repositories/automation-rules.ts
          git commit -m "fix: corrigir inativacao de regra automatica"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
