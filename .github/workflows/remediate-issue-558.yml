name: Remediate issue 558

on:
  push:
    branches:
      - feat/558-configuracoes-secoes-regras-legiveis
    paths:
      - .github/workflows/remediate-issue-558.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply audited remediation
        run: python scripts/remediate-issue-558.py

      - name: Verify generated changes
        run: |
          git diff --check
          test ! -e scripts/remediate-issue-558.py
          test ! -e .github/workflows/remediate-issue-558.yml
          git diff -- apps/web/src/dev-server/settings-page.ts apps/web/src/dev-server/settings-page.test.ts scripts/statement-visual/settings-interface.mjs

      - name: Commit remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: remediar auditoria da issue 558"
          git push origin HEAD:feat/558-configuracoes-secoes-regras-legiveis
