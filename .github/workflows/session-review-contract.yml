# Non-authoritative contract tests: success is NOT a PR review approval.
name: Session review contract tests
on:
  pull_request:
    branches: [develop, main]
    paths:
      - ".github/session-review-policy.json"
      - ".github/workflows/session-review-contract.yml"
      - ".github/workflows/prepare-neutral-audit-packet.yml"
      - "scripts/session_review.py"
      - "scripts/session_review_specification.py"
      - "scripts/prepare_session_review_packet.py"
      - "tests/test_session_review.py"
      - "tests/test_session_review_packet.py"
permissions:
  contents: read
jobs:
  contract:
    name: Positive, negative and regression controls (no approval)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR commit under read-only token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned test runner
        run: python -m pip install --disable-pip-version-check pytest==9.0.2
      - name: Validate source contract and collector (no review check emitted)
        run: python -m pytest -q tests/test_session_review.py tests/test_session_review_packet.py
