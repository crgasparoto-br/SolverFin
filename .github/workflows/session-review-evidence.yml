name: Session review evidence (exact SHA)

# This workflow never publishes a review check. Candidate tests have no
# privileged token; the trusted builder comes from the protected base.
on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

jobs:
  evidence:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted builder from protected base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Checkout exact candidate material without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned governance test runner
        run: python -m pip install --disable-pip-version-check pytest==9.0.2
      - name: Run real governance positive, negative and regression controls
        working-directory: candidate
        run: |
          python -m pytest -q tests/test_session_review.py tests/test_session_review_packet.py \
            tests/test_session_review_verifier.py tests/test_session_review_certificate.py \
            --junitxml="$RUNNER_TEMP/session-review-governance.xml"
      - name: Run real documentary, negative and regression controls
        working-directory: candidate
        run: |
          node --test --test-reporter=junit scripts/statement-visual/*.test.mjs > "$RUNNER_TEMP/session-review-visual.xml"
      - name: Combine only actually executed JUnit cases (Node and pytest)
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree as ET

          temp = Path(os.environ["RUNNER_TEMP"])
          result = ET.Element("testsuites")

          def tag(element):
              return str(element.tag).rsplit("}", 1)[-1]

          for source_name in ("session-review-governance.xml", "session-review-visual.xml"):
              raw = ET.parse(temp / source_name).getroot()
              if tag(raw) not in {"testsuites", "testsuite"}:
                  raise SystemExit("BLOCK: invalid JUnit root in " + source_name)
              for node in raw.iter():
                  if tag(node) in {"failure", "error", "skipped"}:
                      raise SystemExit("BLOCK: failed or skipped JUnit in " + source_name)
                  if tag(node) in {"testsuites", "testsuite"}:
                      if any(node.get(field) not in (None, "0") for field in
                             ("errors", "failures", "skipped")):
                          raise SystemExit("BLOCK: failing JUnit counts in " + source_name)

              cases = [node for node in raw.iter() if tag(node) == "testcase"]
              if not cases:
                  raise SystemExit("BLOCK: no executed JUnit cases in " + source_name)
              suite = ET.SubElement(result, "testsuite", {
                  "name": source_name, "tests": str(len(cases)),
                  "errors": "0", "failures": "0", "skipped": "0",
              })
              for case in cases:
                  if not case.get("name") or any(
                      key in case.attrib for key in ("failure", "error", "skipped")
                  ):
                      raise SystemExit("BLOCK: invalid testcase in " + source_name)
                  if not case.get("classname"):
                      case.set("classname", "node-test-reporter" if "visual" in source_name
                               else "pytest-reporter")
                  for descendant in case.iter():
                      descendant.tag = tag(descendant)
                  suite.append(case)
              print(f"Validated {len(cases)} JUnit cases in {source_name}")
          ET.ElementTree(result).write(
              temp / "session-review-junit.xml", encoding="utf-8", xml_declaration=True
          )
          PY
      - name: Bind test execution to immutable certificate and exact SHA
        env:
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python trusted/scripts/session_review_evidence.py \
            --repo "$REPO" --pr "$PR" --base "$BASE" --head "$HEAD" \
            --junit "$RUNNER_TEMP/session-review-junit.xml" \
            --certificate candidate/.audit/entregar-issue/handoff-ready.json \
            --out "$RUNNER_TEMP/session-review-evidence"
      - name: Upload real exact-SHA evidence (no approval)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: session-review-evidence-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/session-review-evidence/
          if-no-files-found: error
          retention-days: 14
