name: Session review evidence (exact SHA)

# This workflow never publishes a review check. Candidate tests have no
# privileged token; the trusted builder comes from the protected base.
on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

jobs:
  evidence:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted builder from protected base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Checkout exact candidate material without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run real documentary, negative and regression controls
        working-directory: candidate
        run: |
          node --test --test-reporter=junit scripts/statement-visual/*.test.mjs > "$RUNNER_TEMP/session-review-junit.xml"
      - name: Bind test execution to immutable certificate and exact SHA
        env:
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python trusted/scripts/session_review_evidence.py \
            --repo "$REPO" --pr "$PR" --base "$BASE" --head "$HEAD" \
            --junit "$RUNNER_TEMP/session-review-junit.xml" \
            --certificate candidate/.audit/entregar-issue/handoff-ready.json \
            --out "$RUNNER_TEMP/session-review-evidence"
      - name: Upload real exact-SHA evidence (no approval)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: session-review-evidence-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/session-review-evidence/
          if-no-files-found: error
          retention-days: 14
