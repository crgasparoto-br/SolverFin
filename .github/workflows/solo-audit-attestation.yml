name: SolverFin solo Ed25519 audit attestation

# Opt-in, separate assurance. This workflow never claims third-party approval.
# The workflow source must be present on both protected bases and default main.
on:
  pull_request_target:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created, edited, deleted]
  issues:
    types: [edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_run:
    workflows: ["Repository CI"]
    types: [completed]
  push:
    branches: [develop, main]

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read
  checks: write

concurrency:
  group: solverfin-solo-attestation-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify solo audit attestation (exact SHA)
    if: >-
      vars.SOLVERIT_SOLO_AUDIT_ENABLED == 'true' &&
      github.ref_protected &&
      ((github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') ||
       github.event_name == 'pull_request_review') &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request) &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout protected SolverFin source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: repository
          persist-credentials: false
      - name: Checkout immutable official Skill
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: crgasparoto-br/skill
          ref: a28be10db466631cd5e5e4dbe0429da250cd8b42
          path: trusted-skill
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned audit verifier dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r trusted-skill/auditar-issue/requirements.lock.txt
      - name: Check immutable checkouts
        env:
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          test "$(git -C repository rev-parse HEAD)" = "$TRUSTED_WORKFLOW_SHA"
          test "$(git -C trusted-skill rev-parse HEAD)" = "a28be10db466631cd5e5e4dbe0429da250cd8b42"
      - name: Verify the signed report against exact SolverFin CI
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          TRUSTED_RUN_ID: ${{ github.run_id }}
        run: >-
          python repository/scripts/audit/verify_solo_attestation.py
          --repository "$GITHUB_REPOSITORY"
          --event "$GITHUB_EVENT_PATH"
          --trusted-root repository
          --skill-root trusted-skill
          --workflow-sha "$TRUSTED_WORKFLOW_SHA"
          --run-id "$TRUSTED_RUN_ID"
