name: Statement visual validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/run-statement-visual-validation.mjs"
      - "scripts/statement-visual/issue-606-behavior-claims.mjs"
      - ".github/workflows/statement-visual-validation.yml"

permissions:
  contents: write

concurrency:
  group: statement-visual-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-formatter-bridge:
    name: Canonical formatter bridge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Format and restore canonical workflow
        run: |
          npx prettier \
            scripts/run-statement-visual-validation.mjs \
            scripts/statement-visual/issue-606-behavior-claims.mjs \
            --write
          git checkout c2121e2d2b9223d9fd54f2f9f993e71836d6bf3d -- \
            .github/workflows/statement-visual-validation.yml

      - name: Publish canonical formatter commit
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/run-statement-visual-validation.mjs \
            scripts/statement-visual/issue-606-behavior-claims.mjs \
            .github/workflows/statement-visual-validation.yml
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "style(ui): apply canonical formatter"
          git push origin "HEAD:${TARGET_BRANCH}"
