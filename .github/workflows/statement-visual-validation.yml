name: Statement visual validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/statement-visual/coverage-contract.test.mjs"
      - ".github/workflows/statement-visual-validation.yml"

permissions:
  contents: write

jobs:
  contract-expectation-bridge:
    name: Contract expectation bridge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Align fail-closed expectation wording and restore workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/statement-visual/coverage-contract.test.mjs')
          s = p.read_text()
          s = s.replace('lacks explicit real application-flow evidence:', 'lacks observed real application-flow evidence:')
          s = s.replace('explicit equivalent-responsibility claim', 'observed equivalent-responsibility assertion')
          p.write_text(s)
          PY
          git checkout 0ca4ca76191fe9f4c5775358e55c5f092a5f7341 -- .github/workflows/statement-visual-validation.yml

      - name: Publish contract expectation alignment
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/statement-visual/coverage-contract.test.mjs .github/workflows/statement-visual-validation.yml
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "test(ui): align fail-closed expectation wording"
          git push origin "HEAD:${TARGET_BRANCH}"
