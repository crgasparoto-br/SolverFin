name: Temporary align ambiguous message

on:
  pull_request:

permissions:
  contents: write

jobs:
  align-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/553-canonical-manual-installments
          fetch-depth: 0
      - name: Align installment ambiguous feedback and remove helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/dev-server/transactions-page.ts')
          text = path.read_text()
          old = '''          statusNode.className = response.ok ? "form-status success full" : "form-status error full";
          statusNode.textContent = await message(response);
          if (response.ok) {'''
          new = '''          const ambiguousInstallmentResponse =
            mode === "installment" &&
            method === "POST" &&
            (response.status === 0 ||
              response.status === 408 ||
              response.status === 425 ||
              response.status === 429 ||
              response.status >= 500);
          statusNode.className = response.ok ? "form-status success full" : "form-status error full";
          statusNode.textContent = ambiguousInstallmentResponse
            ? "A resposta foi inconclusiva. Tente novamente para confirmar o parcelamento antes de alterar os dados, ou feche o formulário para cancelar esta tentativa."
            : await message(response);
          if (response.ok) {'''
          if old not in text:
              raise SystemExit('submission feedback block not found')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/temporary-align-ambiguous-message.yml').unlink()
          PY
          npx prettier --write apps/web/src/dev-server/transactions-page.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/dev-server/transactions-page.ts .github/workflows/temporary-align-ambiguous-message.yml
          git commit -m "fix: align ambiguous installment feedback"
          git push origin HEAD:feat/553-canonical-manual-installments
