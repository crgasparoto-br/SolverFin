name: Temporary align ambiguous message

on:
  pull_request:

permissions:
  contents: write

jobs:
  align-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/553-canonical-manual-installments
          fetch-depth: 0
      - name: Align installment ambiguous feedback and remove helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('apps/web/src/dev-server/transactions-page.ts')
          text = path.read_text()
          pattern = re.compile(
              r'(?P<indent>\s*)statusNode\.className = response\.ok \? "form-status success full" : "form-status error full";\n'
              r'(?P=indent)statusNode\.textContent = await message\(response\);\n'
              r'(?P=indent)if \(response\.ok\) \{'
          )
          match = pattern.search(text)
          if not match:
              raise SystemExit('submission feedback block not found')
          indent = match.group('indent')
          replacement = (
              f'{indent}const ambiguousInstallmentResponse =\n'
              f'{indent}  mode === "installment" &&\n'
              f'{indent}  method === "POST" &&\n'
              f'{indent}  (response.status === 0 ||\n'
              f'{indent}    response.status === 408 ||\n'
              f'{indent}    response.status === 425 ||\n'
              f'{indent}    response.status === 429 ||\n'
              f'{indent}    response.status >= 500);\n'
              f'{indent}statusNode.className = response.ok ? "form-status success full" : "form-status error full";\n'
              f'{indent}statusNode.textContent = ambiguousInstallmentResponse\n'
              f'{indent}  ? "A resposta foi inconclusiva. Tente novamente para confirmar o parcelamento antes de alterar os dados, ou feche o formulário para cancelar esta tentativa."\n'
              f'{indent}  : await message(response);\n'
              f'{indent}if (response.ok) {{'
          )
          path.write_text(pattern.sub(replacement, text, count=1))
          Path('.github/workflows/temporary-align-ambiguous-message.yml').unlink()
          PY
          npx prettier --write apps/web/src/dev-server/transactions-page.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/dev-server/transactions-page.ts .github/workflows/temporary-align-ambiguous-message.yml
          git commit -m "fix: align ambiguous installment feedback"
          git push origin HEAD:feat/553-canonical-manual-installments
