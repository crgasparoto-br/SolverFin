name: Temporary align visual expectation

on:
  pull_request:

permissions:
  contents: write

jobs:
  align-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/553-canonical-manual-installments
          fetch-depth: 0
      - name: Align stale expectation and remove helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/statement-visual/issue-553-manual-installments-v2.mjs')
          text = path.read_text()
          old = 'waitForFormStatus("operação pode ter sido concluída")'
          new = 'waitForFormStatus("A resposta foi inconclusiva")'
          if old not in text:
              raise SystemExit('stale expectation not found')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/temporary-align-visual.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/statement-visual/issue-553-manual-installments-v2.mjs .github/workflows/temporary-align-visual.yml
          git commit -m "test: align ambiguous recovery visual expectation"
          git push origin HEAD:feat/553-canonical-manual-installments
