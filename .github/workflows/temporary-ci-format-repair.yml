name: Temporary CI format repair

on:
  push:
    branches:
      - codex/610-cards-master-detail

permissions:
  contents: write

jobs:
  format-repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: codex/610-cards-master-detail
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Remove stale legacy card style hooks
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";

          const path = "apps/web/src/dev-server/cards-page-v2.ts";
          let source = await readFile(path, "utf8");
          const hooks = [
            "data-invoice-month-navigation-styles",
            "data-list-sorting-styles",
            "data-cards-interface-styles",
            "data-cards-status-alignment",
          ];
          for (const hook of hooks) {
            const fragment = `    <style ${hook}></style>\n`;
            if (!source.includes(fragment)) {
              throw new Error(`Expected stale style hook not found: ${hook}`);
            }
            source = source.replace(fragment, "");
          }
          await writeFile(path, source);
          NODE

      - name: Apply repository Prettier
        run: |
          npx prettier --write \
            apps/web/src/dev-server/cards-page-v2.test.ts \
            apps/web/src/dev-server/cards-page-v2.ts \
            apps/web/src/dev-server/legacy-html-post-processors.test.ts \
            scripts/statement-visual/cards-interface-adversarial.mjs \
            scripts/statement-visual/cards-interface.mjs

      - name: Commit formatted repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/dev-server/cards-page-v2.test.ts \
            apps/web/src/dev-server/cards-page-v2.ts \
            apps/web/src/dev-server/legacy-html-post-processors.test.ts \
            scripts/statement-visual/cards-interface-adversarial.mjs \
            scripts/statement-visual/cards-interface.mjs
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m "fix(ci): format cards A3 migration"
          git push origin HEAD:codex/610-cards-master-detail
