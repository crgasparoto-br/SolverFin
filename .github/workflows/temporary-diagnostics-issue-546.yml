name: Temporary documentation remediation issue 546

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/546-category-evolution-controls-account-filter

      - name: Align documentation with transaction constraints
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("docs/API_REPORTS.md"): (
                  "Sem `accountId`, o contrato anterior e preservado integralmente: entram todas as transacoes elegiveis do perfil, inclusive movimentos sem conta vinculada.",
                  "Sem `accountId`, o contrato anterior e preservado integralmente: entram todas as transacoes elegiveis do perfil.",
              ),
              Path("docs/REPORTS.md"): (
                  "- **Todas as contas** remove `accountId` da consulta enviada a API e preserva o resultado geral anterior, inclusive movimentos elegiveis sem conta;",
                  "- **Todas as contas** remove `accountId` da consulta enviada a API e preserva o resultado geral anterior;",
              ),
          }

          for path, (before, after) in replacements.items():
              text = path.read_text()
              if before not in text:
                  raise SystemExit(f"Expected documentation text was not found in {path}")
              path.write_text(text.replace(before, after, 1))
          PY

      - name: Commit documentation remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/API_REPORTS.md docs/REPORTS.md
          git commit -m "docs: align account filter contract"
          git push origin HEAD:feat/546-category-evolution-controls-account-filter
