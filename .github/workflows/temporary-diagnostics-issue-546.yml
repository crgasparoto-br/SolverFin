name: Temporary lint remediation issue 546

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/546-category-evolution-controls-account-filter

      - name: Remove unnecessary regex escape
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("apps/web/src/dev-server/reports-route-page.test.ts")
          text = path.read_text()
          before = r'[^\"]*'
          after = r'[^"]*'
          if before not in text:
              raise SystemExit("Expected lint pattern was not found")
          path.write_text(text.replace(before, after, 1))
          PY

      - name: Commit lint remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/dev-server/reports-route-page.test.ts
          git commit -m "fix: remove unnecessary regex escape"
          git push origin HEAD:feat/546-category-evolution-controls-account-filter
