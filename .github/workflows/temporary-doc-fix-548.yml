name: Temporary documentation update issue 548

on:
  push:
    branches:
      - feat/548-ofx-inbox-import
    paths:
      - .github/workflows/temporary-doc-fix-548.yml

permissions:
  contents: write

jobs:
  update-documentation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/548-ofx-inbox-import
          fetch-depth: 0

      - name: Insert canonical STMTTRN scope rule
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/IMPORTS.md")
          content = path.read_text(encoding="utf-8")
          anchor = "Cada um dos campos consumidos em uma movimentação — `DTPOSTED`, `TRNAMT`, `FITID`, `NAME`, `MEMO` e `TRNTYPE` — deve ser um filho direto do respectivo `STMTTRN`"
          replacement = "Cada `STMTTRN` reconhecido deve ser filho direto do `BANKTRANLIST` canônico; uma transação dentro de `EXTENSION`, `WRAPPER` ou qualquer outro contêiner intermediário torna o arquivo inválido.\n\n" + anchor
          if replacement in content:
              raise SystemExit(0)
          if anchor not in content:
              raise SystemExit("documentation anchor not found")
          path.write_text(content.replace(anchor, replacement, 1), encoding="utf-8")
          PY

      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/IMPORTS.md
          if git diff --cached --quiet; then
            echo "No documentation changes required."
            exit 0
          fi
          git commit -m "docs(imports): document canonical OFX transaction scope"
          git push origin HEAD:feat/548-ofx-inbox-import
