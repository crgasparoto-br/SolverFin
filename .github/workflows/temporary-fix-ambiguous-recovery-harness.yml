name: Temporary fix ambiguous recovery harness

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/553-canonical-manual-installments
          fetch-depth: 0
      - name: Make committed-response masking deterministic
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/statement-visual/issue-553-ambiguous-recovery.mjs')
          text = path.read_text()
          start = text.index('async function maskCommittedResponseAsTimeout(action) {')
          end = text.index('async function observeInstallmentRequest(action) {')
          replacement = r'''async function maskCommittedResponseAsTimeout(action) {
            const cookieHeader = await readBrowserCookieHeader();
            let resolveMasked;
            let rejectMasked;
            const masked = new Promise((resolve, reject) => {
              resolveMasked = resolve;
              rejectMasked = reject;
            });
            const operations = [];
            const unsubscribe = browser.cdp.on("Fetch.requestPaused", (paused) => {
              const operation = (async () => {
                const request = readPausedRequest(paused);
                const headers = buildBackendReplayHeaders(paused.request.headers, cookieHeader);
                const backendResponse = await fetch(paused.request.url, {
                  method: paused.request.method,
                  headers,
                  body: paused.request.postData,
                  redirect: "manual",
                });
                const backendStatus = backendResponse.status;
                const backendBody = await backendResponse.text();
                assert.equal(
                  backendStatus,
                  201,
                  `Expected committed backend response, received ${backendStatus}: ${backendBody}`,
                );

                await browser.cdp.send("Fetch.fulfillRequest", {
                  requestId: paused.requestId,
                  responseCode: 504,
                  responsePhrase: "Gateway Timeout",
                  responseHeaders: [
                    { name: "content-type", value: "application/json; charset=utf-8" },
                  ],
                  body: Buffer.from(
                    JSON.stringify({
                      error: {
                        code: "GATEWAY_TIMEOUT",
                        message: "Tempo limite no gateway; a operação pode ter sido concluída.",
                      },
                    }),
                  ).toString("base64"),
                });
                resolveMasked({ request, backendStatus });
              })().catch(rejectMasked);
              operations.push(operation);
            });

            await browser.cdp.send("Fetch.enable", {
              patterns: [{ urlPattern: "*api/installments*", requestStage: "Request" }],
            });
            try {
              await action();
              const result = await Promise.race([
                masked,
                sleep(10_000).then(() => {
                  throw new Error("Timed out while masking the committed installment response");
                }),
              ]);
              await Promise.all(operations);
              return result;
            } finally {
              unsubscribe();
              await browser.cdp.send("Fetch.disable");
            }
          }

          async function readBrowserCookieHeader() {
            const result = await browser.cdp.send("Network.getCookies", { urls: [baseUrl] });
            return result.cookies.map((cookie) => `${cookie.name}=${cookie.value}`).join("; ");
          }

          function buildBackendReplayHeaders(requestHeaders, cookieHeader) {
            const headers = new Headers();
            for (const name of ["accept", "authorization", "content-type", "x-correlation-id"]) {
              const value = requestHeaders[name] ?? requestHeaders[name.toUpperCase()];
              if (typeof value === "string" && value) headers.set(name, value);
            }
            if (cookieHeader) headers.set("cookie", cookieHeader);
            return headers;
          }

          '''
          path.write_text(text[:start] + replacement + text[end:])
          Path('.github/workflows/temporary-fix-ambiguous-recovery-harness.yml').unlink()
          PY
          npx prettier --write scripts/statement-visual/issue-553-ambiguous-recovery.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/statement-visual/issue-553-ambiguous-recovery.mjs .github/workflows/temporary-fix-ambiguous-recovery-harness.yml
          git commit -m "test: make ambiguous commit masking deterministic"
          git push origin HEAD:feat/553-canonical-manual-installments
