name: Temporary fix ambiguous replay origin

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/553-canonical-manual-installments
          fetch-depth: 0
      - name: Preserve trusted mutation origin and remove helper
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/statement-visual/issue-553-ambiguous-recovery.mjs')
          text = path.read_text()
          function_start = text.index('function buildBackendReplayHeaders(requestHeaders, cookieHeader) {')
          block_start = text.index('  for (const name of [', function_start)
          block_end = text.index('  return headers;', block_start) + len('  return headers;')
          replacement = '''  for (const name of [
            "accept",
            "authorization",
            "content-type",
            "referer",
            "x-correlation-id",
          ]) {
            const value = requestHeaders[name] ?? requestHeaders[name.toUpperCase()];
            if (typeof value === "string" && value) headers.set(name, value);
          }
          headers.set("origin", new URL(baseUrl).origin);
          if (cookieHeader) headers.set("cookie", cookieHeader);
          return headers;'''
          path.write_text(text[:block_start] + replacement + text[block_end:])
          Path('.github/workflows/temporary-fix-ambiguous-replay-origin.yml').unlink()
          PY
          npx prettier --write scripts/statement-visual/issue-553-ambiguous-recovery.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/statement-visual/issue-553-ambiguous-recovery.mjs .github/workflows/temporary-fix-ambiguous-replay-origin.yml
          git commit -m "test: preserve origin in ambiguous backend replay"
          git push origin HEAD:feat/553-canonical-manual-installments
