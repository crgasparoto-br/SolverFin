name: Temporary format issue 548

on:
  push:
    branches:
      - feat/548-ofx-inbox-import
    paths:
      - .github/workflows/temporary-format-548.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/548-ofx-inbox-import
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format remediation files
        run: >-
          npx prettier
          apps/api/src/ofx-import-audit-remediation.integration.test.ts
          apps/api/src/ofx-import-pending-findings.test.ts
          apps/api/src/repositories/ofx-import-store.ts
          apps/api/src/repositories/ofx-import-structure.ts
          --write

      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/ofx-import-audit-remediation.integration.test.ts \
            apps/api/src/ofx-import-pending-findings.test.ts \
            apps/api/src/repositories/ofx-import-store.ts \
            apps/api/src/repositories/ofx-import-structure.ts
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "style(imports): format issue 548 remediations"
          git push origin HEAD:feat/548-ofx-inbox-import
