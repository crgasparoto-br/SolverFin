name: Temporary format assist

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Format issue 553 scenario
        run: npx prettier --write scripts/statement-visual/issue-553-ambiguous-recovery.mjs
      - name: Upload formatted scenario
        uses: actions/upload-artifact@v4
        with:
          name: issue-553-formatted-scenario
          path: scripts/statement-visual/issue-553-ambiguous-recovery.mjs
          retention-days: 1
