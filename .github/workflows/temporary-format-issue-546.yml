name: Temporary format issue 546

on:
  push:
    branches:
      - feat/546-category-evolution-controls-account-filter

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/546-category-evolution-controls-account-filter

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format regression test and remove temporary workflow
        run: |
          npx prettier apps/web/src/dev-server/reports-route-page-shared.test.ts --write
          rm .github/workflows/temporary-format-issue-546.yml

      - name: Commit exact repository formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/dev-server/reports-route-page-shared.test.ts .github/workflows/temporary-format-issue-546.yml
          git commit -m "style(reports): apply repository formatter"
          git push origin HEAD:feat/546-category-evolution-controls-account-filter
