name: Temporary format issue 546

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/546-category-evolution-controls-account-filter

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Format issue files
        run: |
          npx prettier --write \
            apps/api/src/category-evolution-account-filter.integration.test.ts \
            apps/api/src/category-evolution-account-filter.test.ts \
            apps/api/src/category-evolution-account-filter.ts \
            apps/api/src/category-evolution-account-router.integration.test.ts \
            apps/api/src/reports-router.ts \
            apps/web/src/dev-server.ts \
            apps/web/src/dev-server/reports-canonical-location.test.ts \
            apps/web/src/dev-server/reports-canonical-location.ts \
            apps/web/src/dev-server/reports-category-evolution-issue-546.test.ts \
            apps/web/src/dev-server/reports-category-evolution-runtime.ts \
            apps/web/src/dev-server/reports-route-page-styles.ts \
            apps/web/src/dev-server/reports-route-page.test.ts \
            apps/web/src/dev-server/reports-route-page.ts \
            docs/API_REPORTS.md \
            docs/REPORTS.md \
            scripts/run-statement-visual-validation.mjs \
            scripts/statement-visual/issue-546-reports-category-controls.mjs

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "style: format issue 546 files"
          git push origin HEAD:feat/546-category-evolution-controls-account-filter
