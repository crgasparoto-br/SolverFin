name: Temporary format preview

on:
  push:
    branches:
      - feat/553-canonical-manual-installments

permissions:
  contents: write

jobs:
  format-preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/553-canonical-manual-installments
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Format remediation files
        run: >-
          npx prettier --write
          apps/api/src/errors.test.ts
          apps/api/src/manual-installments-public-boundary.integration.test.ts
          scripts/statement-visual/issue-553-manual-installments.mjs
      - name: Commit formatting when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api/src/errors.test.ts apps/api/src/manual-installments-public-boundary.integration.test.ts scripts/statement-visual/issue-553-manual-installments.mjs
          git commit -m "style: apply prettier to issue 553 remediation"
          git push origin HEAD:feat/553-canonical-manual-installments
