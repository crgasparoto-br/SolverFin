name: Temporary issue 553 form control fix

on:
  push:
    branches:
      - feat/553-canonical-manual-installments

permissions:
  contents: write

jobs:
  patch-harness:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/553-canonical-manual-installments
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Patch form controls and request diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/statement-visual/issue-553-manual-installments.mjs')
          source = path.read_text()
          source = source.replace(
              'window.__issue553Probe = { calls: [], failNext: false };',
              'window.__issue553Probe = { calls: [], observed: [], failNext: false };',
              1,
          )
          old_probe = '''        if (url.pathname === "/api/installments" && method === "POST") {
                    const payload = JSON.parse(String(init.body || "{}"));
                    const { idempotencyKey, ...businessPayload } = payload;
                    window.__issue553Probe.calls.push({
                      idempotencyKey,
                      fingerprint: JSON.stringify(businessPayload),
                      payload
                    });
                    if (window.__issue553Probe.failNext) {
                      window.__issue553Probe.failNext = false;
                      throw new TypeError("issue-553 simulated ambiguous network failure");
                    }
                  }'''
          new_probe = '''        if (method !== "GET") {
                    window.__issue553Probe.observed.push({ pathname: url.pathname, method });
                  }
                  if (url.pathname === "/api/installments" && method === "POST") {
                    const payload = JSON.parse(String(init.body || "{}"));
                    const { idempotencyKey, ...businessPayload } = payload;
                    window.__issue553Probe.calls.push({
                      idempotencyKey,
                      fingerprint: JSON.stringify(businessPayload),
                      payload
                    });
                    if (window.__issue553Probe.failNext) {
                      window.__issue553Probe.failNext = false;
                      throw new TypeError("issue-553 simulated ambiguous network failure");
                    }
                  }'''
          if old_probe not in source:
              raise SystemExit('request probe sequence not found')
          source = source.replace(old_probe, new_probe, 1)

          start = source.index('async function fillInstallmentForm({')
          end = source.index('\nasync function fillMoney', start)
          replacement = '''async function fillInstallmentForm({
            amount,
            plannedOn,
            installments,
            installmentStart,
            amountMode,
            description,
            note,
          }) {
            await evaluate(
              browser.cdp,
              `(() => {
                const form = document.querySelector("[data-form]");
                const control = (name) => form.elements.namedItem(name);
                control("kind").value = "expense";
                control("repeatMode").value = "installment";
                control("repeatMode").dispatchEvent(new Event("change", { bubbles: true }));
                control("amountMinor").value = ${JSON.stringify(amount)};
                control("plannedOn").value = ${JSON.stringify(plannedOn)};
                control("effectiveOn").value = "";
                control("installments").value = ${JSON.stringify(String(installments))};
                control("installments").dispatchEvent(new Event("input", { bubbles: true }));
                control("installmentStart").value = ${JSON.stringify(String(installmentStart))};
                control("installmentValueMode").value = ${JSON.stringify(amountMode)};
                control("description").value = ${JSON.stringify(description)};
                control("note").value = ${JSON.stringify(note)};
                control("status").value = "planned";
                return {
                  repeatMode: control("repeatMode").value,
                  hidden: control("repeatMode").closest("label")?.hidden === true,
                };
              })()`,
            );
          }
          '''
          source = source[:start] + replacement + source[end:]
          source = source.replace(
              '''        calls: window.__issue553Probe?.calls || [],
                    globalOverflow:''',
              '''        calls: window.__issue553Probe?.calls || [],
                    observed: window.__issue553Probe?.observed || [],
                    repeatMode: form.elements.namedItem("repeatMode")?.value || "",
                    globalOverflow:''',
              1,
          )
          source = source.replace(
              '''              calls: window.__issue553Probe?.calls || [],
                        keyboardSubmit:''',
              '''              calls: window.__issue553Probe?.calls || [],
                        observed: window.__issue553Probe?.observed || [],
                        repeatMode: form?.elements.namedItem("repeatMode")?.value || "",
                        keyboardSubmit:''',
              1,
          )
          path.write_text(source)
          PY
          npx prettier --write scripts/statement-visual/issue-553-manual-installments.mjs
      - name: Commit harness correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/statement-visual/issue-553-manual-installments.mjs
          git diff --cached --quiet && exit 0
          git commit -m "test(web): use explicit installment form controls"
          git push origin HEAD:feat/553-canonical-manual-installments
