name: Temporary issue 553 harness fix

on:
  push:
    branches:
      - feat/553-canonical-manual-installments

permissions:
  contents: write

jobs:
  patch-harness:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/553-canonical-manual-installments
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Patch browser harness
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/statement-visual/issue-553-manual-installments.mjs')
          source = path.read_text()
          old_first = '''  await evaluate(browser.cdp, `window.__issue553Probe.failNext = true`);
            await submitByKeyboard();
            const ambiguousFailure = await waitForFormStatus("Seus dados foram preservados");'''
          new_first = '''  const keyboardSubmitActivated = await proveKeyboardSubmitActivation();
            check(
              keyboardSubmitActivated,
              "Enter did not activate the installment form submit control",
              { keyboardSubmitActivated },
            );
            await evaluate(browser.cdp, `window.__issue553Probe.failNext = true`);
            await submitForm();
            const ambiguousFailure = await waitForFormStatus("Seus dados foram preservados");'''
          old_retry = '''  await submitByKeyboard();
            await waitForFormStatus("Ação concluída");'''
          new_retry = '''  await submitForm();
            await waitForFormStatus("Ação concluída");'''

          if old_first not in source:
              raise SystemExit('desktop submit sequence not found')
          if old_retry not in source:
              raise SystemExit('retry submit sequence not found')
          source = source.replace(old_first, new_first, 1)
          source = source.replace(old_retry, new_retry, 1)
          if 'submitByKeyboard()' in source:
              raise SystemExit('stale submitByKeyboard reference remains')
          path.write_text(source)
          PY
          npx prettier --write scripts/statement-visual/issue-553-manual-installments.mjs
      - name: Commit harness correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/statement-visual/issue-553-manual-installments.mjs
          git diff --cached --quiet && exit 0
          git commit -m "test(web): complete keyboard and retry harness separation"
          git push origin HEAD:feat/553-canonical-manual-installments
