name: Temporary issue 553 listener cleanup

on:
  push:
    branches:
      - feat/553-canonical-manual-installments

permissions:
  contents: write

jobs:
  patch-harness:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/553-canonical-manual-installments
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Clean up keyboard probe listener
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/statement-visual/issue-553-manual-installments.mjs')
          source = path.read_text()
          old = '''      window.__issue553KeyboardSubmit = false;
                form.addEventListener(
                  "submit",
                  (event) => {
                    event.preventDefault();
                    event.stopImmediatePropagation();
                    window.__issue553KeyboardSubmit = true;
                  },
                  { capture: true, once: true },
                );
                submit.focus();'''
          new = '''      window.__issue553KeyboardSubmit = false;
                window.__issue553KeyboardSubmitHandler = (event) => {
                  event.preventDefault();
                  event.stopImmediatePropagation();
                  window.__issue553KeyboardSubmit = true;
                };
                form.addEventListener("submit", window.__issue553KeyboardSubmitHandler, {
                  capture: true,
                  once: true,
                });
                submit.focus();'''
          old_return = '''  await pressKey("Enter");
            return evaluate(browser.cdp, `window.__issue553KeyboardSubmit === true`);
          }'''
          new_return = '''  await pressKey("Enter");
            return evaluate(
              browser.cdp,
              `(() => {
                const form = document.querySelector("[data-form]");
                const activated = window.__issue553KeyboardSubmit === true;
                if (window.__issue553KeyboardSubmitHandler) {
                  form.removeEventListener("submit", window.__issue553KeyboardSubmitHandler, true);
                  delete window.__issue553KeyboardSubmitHandler;
                }
                return activated;
              })()`,
            );
          }'''
          old_timeout = '''      throw new Error("Timed out waiting for form status: " + ${JSON.stringify(expectedText)});'''
          new_timeout = '''      const form = document.querySelector("[data-form]");
                throw new Error(
                  "Timed out waiting for form status: " + ${JSON.stringify(expectedText)}
                    + " diagnostic=" + JSON.stringify({
                      actualText: document.querySelector("[data-form] .form-status")?.textContent || "",
                      submitting: form?.dataset.submitting || "",
                      submitDisabled: form?.querySelector('button[type="submit"]')?.disabled === true,
                      calls: window.__issue553Probe?.calls || [],
                      keyboardSubmit: window.__issue553KeyboardSubmit === true,
                    }),
                );'''
          for label, before, after in [
              ('listener', old, new),
              ('return cleanup', old_return, new_return),
              ('timeout diagnostic', old_timeout, new_timeout),
          ]:
              if before not in source:
                  raise SystemExit(f'{label} sequence not found')
              source = source.replace(before, after, 1)
          path.write_text(source)
          PY
          npx prettier --write scripts/statement-visual/issue-553-manual-installments.mjs
      - name: Commit harness correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/statement-visual/issue-553-manual-installments.mjs
          git diff --cached --quiet && exit 0
          git commit -m "test(web): clean up keyboard probe before retry scenario"
          git push origin HEAD:feat/553-canonical-manual-installments
