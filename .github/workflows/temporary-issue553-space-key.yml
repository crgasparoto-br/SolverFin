name: Temporary issue 553 space key

on:
  push:
    branches:
      - feat/553-canonical-manual-installments

permissions:
  contents: write

jobs:
  patch-harness:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/553-canonical-manual-installments
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Use the button keyboard activation key
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/statement-visual/issue-553-manual-installments.mjs')
          source = path.read_text()
          old_call = '''  await pressKey("Enter");
            return evaluate(
              browser.cdp,
              `(() => {
                const form = document.querySelector("[data-form]");
                const activated = window.__issue553KeyboardSubmit === true;'''
          new_call = '''  await pressKey("Space");
            return evaluate(
              browser.cdp,
              `(() => {
                const form = document.querySelector("[data-form]");
                const activated = window.__issue553KeyboardSubmit === true;'''
          if old_call not in source:
              raise SystemExit('keyboard submit call not found')
          source = source.replace(old_call, new_call, 1)

          old_press = '''async function pressKey(key) {
            const keyCode = key === "Enter" ? 13 : 0;
            const text = key === "Enter" ? "\\r" : "";
            await browser.cdp.send("Input.dispatchKeyEvent", {
              type: "keyDown",
              key,
              code: key,
              text,
              unmodifiedText: text,
              windowsVirtualKeyCode: keyCode,
              nativeVirtualKeyCode: keyCode,
            });
            await browser.cdp.send("Input.dispatchKeyEvent", {
              type: "keyUp",
              key,
              code: key,
              windowsVirtualKeyCode: keyCode,
              nativeVirtualKeyCode: keyCode,
            });
            await sleep(100);
          }'''
          new_press = '''async function pressKey(key) {
            const isSpace = key === "Space";
            const keyCode = key === "Enter" ? 13 : isSpace ? 32 : 0;
            const keyValue = isSpace ? " " : key;
            const code = isSpace ? "Space" : key;
            const text = key === "Enter" ? "\\r" : "";
            await browser.cdp.send("Input.dispatchKeyEvent", {
              type: isSpace ? "rawKeyDown" : "keyDown",
              key: keyValue,
              code,
              text,
              unmodifiedText: text,
              windowsVirtualKeyCode: keyCode,
              nativeVirtualKeyCode: keyCode,
            });
            await browser.cdp.send("Input.dispatchKeyEvent", {
              type: "keyUp",
              key: keyValue,
              code,
              windowsVirtualKeyCode: keyCode,
              nativeVirtualKeyCode: keyCode,
            });
            await sleep(100);
          }'''
          if old_press not in source:
              raise SystemExit('pressKey implementation not found')
          source = source.replace(old_press, new_press, 1)
          source = source.replace(
              '"Enter did not activate the installment form submit control"',
              '"Keyboard did not activate the installment form submit control"',
              1,
          )
          path.write_text(source)
          PY
          npx prettier --write scripts/statement-visual/issue-553-manual-installments.mjs
      - name: Commit harness correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/statement-visual/issue-553-manual-installments.mjs
          git diff --cached --quiet && exit 0
          git commit -m "test(web): validate submit button with space key"
          git push origin HEAD:feat/553-canonical-manual-installments
